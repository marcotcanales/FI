        const Headphones = ({ className }) => <IconWrapper className={className}><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></IconWrapper>;

        // --- PALETA DE COLORES UNITEC ---
        const UNITEC_COLORS = {
            federalBlue: '#06065C',

        const PIE_COLORS = [UNITEC_COLORS.federalBlue, UNITEC_COLORS.pacificCyan, UNITEC_COLORS.vividSky, UNITEC_COLORS.neutral];

        // --- DATOS COMPLETOS ---
        const comparativeData = [
            { id: "L1", question: "Entendimiento Profundo", fullQuestion: "Siento que entiendo por qué las estructuras se comportan como lo hacen, más allá de simplemente saber usar las fórmulas o el software.", observation: "La evaluación con CGS logró una percepción del 100% en entendimiento profundo. La metodología mixta resultó ser la menos efectiva en este aspecto.", data: [ { name: 'Trayectoria A', 'Totalmente de acuerdo': 66, 'De acuerdo': 0, 'Neutro': 33 }, { name: 'Trayectoria B', 'Totalmente de acuerdo': 100, 'De acuerdo': 0, 'Neutro': 0 }, { name: 'Trayectoria C', 'Totalmente de acuerdo': 0, 'De acuerdo': 100, 'Neutro': 0 } ], keys: ['Totalmente de acuerdo', 'De acuerdo', 'Neutro'] },
            { id: "L2", question: "Idealización vs Matemáticas", fullQuestion: "La evaluación me ayudó a entender que el Análisis Estructural es un proceso de idealización (donde mi criterio define la geometría y cargas) y no solo un proceso matemático.", observation: "La evaluación con CGS alcanzó un 100% de percepción respecto a la idealización de conceptos, superando el paradigma del simple cálculo numérico.", data: [ { name: 'Trayectoria A', 'Totalmente de acuerdo': 33, 'De acuerdo': 33, 'Neutro': 33 }, { name: 'Trayectoria B', 'Totalmente de acuerdo': 100, 'De acuerdo': 0, 'Neutro': 0 }, { name: 'Trayectoria C', 'Totalmente de acuerdo': 50, 'De acuerdo': 50, 'Neutro': 0 } ], keys: ['Totalmente de acuerdo', 'De acuerdo', 'Neutro'] },
            { id: "L3", question: "Toma de Decisiones", fullQuestion: "Me siento capaz de tomar decisiones de diseño incluso cuando no tengo toda la información perfecta o completa.", observation: "La evaluación con CGS obtuvo la mejor percepción en capacidad de toma de decisiones bajo incertidumbre, un rasgo clave del Creador Innovador.", data: [ { name: 'Trayectoria A', 'Totalmente de acuerdo': 33, 'De acuerdo': 33, 'Neutro': 33 }, { name: 'Trayectoria B', 'Totalmente de acuerdo': 50, 'De acuerdo': 50, 'Neutro': 0 }, { name: 'Trayectoria C', 'Totalmente de acuerdo': 0, 'De acuerdo': 100, 'Neutro': 0 } ], keys: ['Totalmente de acuerdo', 'De acuerdo', 'Neutro'] },
            { id: "L4", question: "Uso Real y Seguridad", fullQuestion: "Siento que la evaluación me hizo considerar el uso real, la seguridad y las necesidades de las personas que habitarán la estructura.", observation: "El 100% de los estudiantes bajo CGS conectaron el cálculo estructural con la empatía hacia el usuario final (Solucionador de Problemas Empático).", data: [ { name: 'Trayectoria A', 'Totalmente de acuerdo': 66, 'De acuerdo': 33, 'Neutro': 0 }, { name: 'Trayectoria B', 'Totalmente de acuerdo': 100, 'De acuerdo': 0, 'Neutro': 0 }, { name: 'Trayectoria C', 'Totalmente de acuerdo': 0, 'De acuerdo': 0, 'Neutro': 100 } ], keys: ['Totalmente de acuerdo', 'De acuerdo', 'Neutro'] },
            { id: "L5", question: "Responsabilidad Ética", fullQuestion: "Sentí la responsabilidad ética de que mis cálculos impactan directamente en la seguridad pública.", observation: "Tanto CGS como la vía tradicional obtuvieron altas marcas, demostrando que el rigor técnico per se inspira responsabilidad, aunque el CGS lo contextualiza mejor.", data: [ { name: 'Trayectoria A', 'Totalmente de acuerdo': 100, 'De acuerdo': 0 }, { name: 'Trayectoria B', 'Totalmente de acuerdo': 100, 'De acuerdo': 0 }, { name: 'Trayectoria C', 'Totalmente de acuerdo': 50, 'De acuerdo': 50 } ], keys: ['Totalmente de acuerdo', 'De acuerdo'] },
            { id: "L6", question: "Aplicabilidad", fullQuestion: "Siento que puedo aplicar lo aprendido a situaciones completamente nuevas o a otros cursos.", observation: "La percepción de aplicabilidad es absoluta en las trayectorias puras (A y B), destacando el valor de la inmersión profunda frente a enfoques híbridos.", data: [ { name: 'Trayectoria A', 'Totalmente de acuerdo': 100, 'De acuerdo': 0 }, { name: 'Trayectoria B', 'Totalmente de acuerdo': 100, 'De acuerdo': 0 }, { name: 'Trayectoria C', 'Totalmente de acuerdo': 0, 'De acuerdo': 100 } ], keys: ['Totalmente de acuerdo', 'De acuerdo'] },
            { id: "L7", question: "Esfuerzo Percibido", fullQuestion: "Comparado con la otra opción de evaluación, siento que mi elección requirió:", observation: "El método CGS exige significativamente mayor esfuerzo y tiempo. Su éxito no radica en ser 'más fácil', sino en ofrecer un mayor 'retorno de valor'.", data: [ { name: 'Trayectoria A', 'Esfuerzo similar': 100, 'Mucho más esfuerzo': 0, 'Mucho menos esfuerzo': 0 }, { name: 'Trayectoria B', 'Esfuerzo similar': 50, 'Mucho más esfuerzo': 50, 'Mucho menos esfuerzo': 0 }, { name: 'Trayectoria C', 'Esfuerzo similar': 50, 'Mucho más esfuerzo': 0, 'Mucho menos esfuerzo': 50 } ], keys: ['Mucho más esfuerzo', 'Esfuerzo similar', 'Mucho menos esfuerzo'] },
            { id: "L8", question: "Elección Futura", fullQuestion: "Si pudieras volver a cursar la asignatura, ¿volverías a elegir el mismo método de evaluación?", observation: "A pesar del mayor esfuerzo, el 100% de la Trayectoria B (CGS) reafirma su elección, evidenciando una alta satisfacción intrínseca por el aprendizaje logrado.", data: [ { name: 'Trayectoria A', 'Mismo método': 0, 'Tal vez cambiaría': 66, 'Cambiaría': 33 }, { name: 'Trayectoria B', 'Mismo método': 100, 'Tal vez cambiaría': 0, 'Cambiaría': 0 }, { name: 'Trayectoria C', 'Mismo método': 50, 'Tal vez cambiaría': 0, 'Cambiaría': 50 } ], keys: ['Mismo método', 'Tal vez cambiaría', 'Cambiaría'] }
        ];

        const reflectionData = {
            A: { id: "OA1", label: "Trayectoria A", title: "Evaluación Tradicional", observation: "Las reflexiones muestran satisfacción con la claridad del docente, pero una latente curiosidad (y arrepentimiento) por no haber vivido la experiencia de modelación del proyecto.", responses: [ "No cambiaría nada porque el desarrollo del curso estuvo bien explicado por parte del docente.", "Que si se da la opción de un proyecto sea como el del segundo parcial, elegir el modelo.", "Creo que nada" ] },
            B: { id: "OB1", label: "Trayectoria B", title: "Evaluación CGS", observation: "La inmersión generó alta satisfacción, pero los estudiantes solicitan más 'Andamiaje' (Scaffolding) a través de foros y tiempo de discusión formativa.", responses: [ "Usaría el método de los Foros... si se usa de nuevo para los dos proyectos, habría más orden y coordinación.", "La metodología me pareció buena... Tal vez se podría incluir más tiempo para preguntas o discusión, para reforzar el aprendizaje.", "Considero que fue una clase muy productiva. Logré aprender muchas cosas... la combinación que hicimos entre el software y los cálculos manuales fue excelente." ] },
            C: { id: "OC1", label: "Trayectoria C", title: "Evaluación Mixta", observation: "El enfoque híbrido evidenció la presión temporal, revelando que combinar metodologías activas y tradicionales en un mismo bloque puede sobrecargar al estudiante.", responses: [ "Nada, todo me pareció bien explicado a pesar que fuera una clase bien analítica y con bastantes cálculos.", "Más tiempo para hacer el primer proyecto." ] }
        };

        const trajectoryData = {
            A: {
                title: "Trayectoria A - Evaluación Tradicional",
                icon: <BookOpen className="w-5 h-5 text-white" />,
                description: "Estudiantes que optaron exclusivamente por exámenes escritos enfocados en competencia matemática.",
                pieCharts: [ { title: "PA1", question: "¿Cuál fue el factor determinante para NO intentar el proyecto CGS?", observation: "La percepción de falta de tiempo y la comodidad de la 'costumbre' fueron los principales disuasivos, revelando el desafío de la carga académica.", data: [ { name: 'Factor Tiempo', value: 66 }, { name: 'Costumbre/Examen', value: 33 } ] } ],
                quotes: [
                    { title: "PA2", question: "Los proyectos simulan la vida real. ¿Sientes que perdiste una oportunidad?", observation: "Reconocimiento retrospectivo del valor del aprendizaje transformacional sobre el transaccional.", responses: [ "Al final sentí que era mejor opción el proyecto por la toma de decisiones y si volviera a haber la oportunidad escogería el proyecto", "Sentí que mis compañeros que realizaron el proyecto pudieron trabajar de manera más cercana a lo que nos espera en un ambiente laboral" ] }
                ]
            },
            B: {
                title: "Trayectoria B - Evaluación CGS",
                icon: <Layout className="w-5 h-5 text-white" />,
                description: "Estudiantes inmersos en el rol de consultores, enfrentando la idealización y toma de decisiones.",
                pieCharts: [ { title: "PB1", question: "Comparado con la vía tradicional, ¿cómo describirías tu carga de trabajo?", observation: "Todos reconocieron una inversión 'Alta', validando que el CGS no reduce el rigor, sino que lo reorienta hacia la utilidad práctica.", data: [ { name: 'Inversión Alta (Más aprendizaje)', value: 100 } ] } ],
                quotes: [
                    { title: "PB2", question: "¿Dejaste de actuar como 'estudiante' y empezaste a pensar como 'Consultor Empático'?", observation: "Evidencia directa de la formación de la capacidad 'Empathetic Problem-Solver' descrita en el Retrato UNITEC.", responses: [ "Sí. Con los proyectos sentí que ya no estaba pensando solo en la nota, sino en resolver un problema real.", "Así es como vamos a diseñar, con los planos y la computadora, no como una evaluación tradicional." ] }
                ]
            },
            C: {
                title: "Trayectoria C - Evaluación Mixta",
                icon: <PenTool className="w-5 h-5 text-white" />,
                description: "Estudiantes que transicionaron entre metodologías debido a externalidades temporales o técnicas.",
                pieCharts: [ { title: "PC1", question: "¿Cuál método te hizo sentir más orgulloso de tu resultado final?", observation: "El sentido de agencia y logro es inherentemente superior cuando el alumno construye el conocimiento (CGS).", data: [ { name: 'El Proyecto (CGS)', value: 100 } ] } ],
                quotes: [
                    { title: "PC2", question: "¿Por qué decidiste cambiar de método a mitad del curso?", observation: "El abandono del CGS estuvo ligado a brechas de acceso a tecnología (software) o sobrecarga, áreas críticas a monitorear institucionalmente.", responses: [ "En el primero hice examen porque vi que era mucho trabajo...", "Hice el primer proyecto pero no hice el segundo, principalmente por mi computadora." ] }
                ]
            }
        };

        // --- COMPONENTES UI UNITEC ---

        const NavButton = ({ active, onClick, icon: Icon, label }) => (
            <button 
                onClick={onClick}
                className={`
                    flex-shrink-0 relative px-5 py-4 font-semibold text-sm tracking-wide uppercase transition-all duration-300
                    flex items-center gap-2 border-b-4
                    ${active 
                        ? 'border-unitec-cyan text-unitec-blue bg-white' 
                        : 'border-transparent text-slate-400 hover:text-unitec-blue hover:bg-slate-100'
                    }
                `}
            >
                {Icon && <Icon className={`w-4 h-4 ${active ? 'text-unitec-cyan' : 'text-slate-400'}`} />}
                {label}
            </button>
        );

        const SectionTitle = ({ title, subtitle }) => (
            <div className="mb-8 border-l-4 border-unitec-cyan pl-4">

        );

        const Card = ({ children, className = "" }) => (

        );

        const ObservationBox = ({ text }) => (

                <div>
                    <h5 className="font-bold text-unitec-blue text-xs uppercase tracking-wider mb-1">Hallazgo Clave</h5>
                    <p className="text-slate-700 text-sm italic">{text}</p>

        // --- APP PRINCIPAL ---

        const App = () => {
            const [activeTab, setActiveTab] = useState('summary');
            const [selectedQuestion, setSelectedQuestion] = useState(comparativeData[0].id);

            const renderContent = () => {
                // 1. Resumen
                if (activeTab === 'summary') {
                    return (
                        <div className="fade-in max-w-5xl mx-auto">
                            <SectionTitle title="Resumen Ejecutivo" subtitle="Transición del modelo de competencias a la formación de capacidades humanas." />
                            <Card className="mb-8">
                                <div className="border-b border-slate-100 pb-4 mb-6">
                                    <h1 className="text-2xl md:text-3xl font-extrabold text-unitec-blue mb-2 leading-tight">
                                        Piloto de Implementación del Collective Growth System (CGS) en Ingeniería
                                    </h1>
                                    <div className="flex flex-col md:flex-row gap-4 mt-4 text-sm text-slate-500 font-medium">
                                        <div className="flex items-center gap-2">
                                            <span className="bg-unitec-cyan/10 text-unitec-cyan px-2 py-1 rounded">Autor</span>
                                            Marco Tulio Canales Chavez, PhD
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <span className="bg-unitec-blue/10 text-unitec-blue px-2 py-1 rounded">Institución</span>
                                            Universidad Tecnológica Centroamericana (UNITEC)
                                        </div>
                                    </div>
                                </div>
                                <div className="space-y-6 text-slate-700 leading-relaxed text-justify">
                                    <p>
                                        Este estudio presenta los resultados de un piloto de implementación del Collective Growth System (CGS) en la enseñanza de Ingeniería, contrastando el modelo tradicional transaccional con un enfoque de formación de capacidades humanas integrales promovido por la Visión UNITEC 2030. Mediante un diseño de investigación comparativo en la asignatura de Análisis Estructural (CIV324), se evaluaron tres trayectorias de aprendizaje (tradicional, CGS y mixta) para analizar su impacto en la comprensión conceptual, la identidad profesional y la ética.
                                    </p>
                                    <p>
                                        Los resultados validan que la inmersión en contextos simulados y roles profesionales cataliza la transición del cálculo mecánico al criterio ingenieril, superando las limitaciones del modelo tradicional en la toma de decisiones bajo incertidumbre.
                                    </p>
                                    <div className="bg-unitec-gray p-5 rounded-md border-l-4 border-unitec-sky font-semibold italic text-unitec-blue">
                                        "Significativamente, los hallazgos desafían la noción de la resistencia académica: los estudiantes demostraron disposición a asumir una carga cognitiva y temporal superior cuando perciben un retorno de valor en su formación profesional."
                                    </div>
                                    <p>
                                        El estudio concluye que el modelo CGS es superior para activar la responsabilidad ética intrínseca y la seguridad cognitiva, permitiendo al estudiante evolucionar de un "buscador de notas" a un "Solucionador de Problemas Empático".
                                    </p>
                                </div>
                            </Card>
                        </div>
                    );
                }

                // 2. Introducción
                if (activeTab === 'intro') {
                    return (
                        <div className="fade-in max-w-5xl mx-auto">
                            <SectionTitle title="Introducción y Metodología" subtitle="Contexto Pedagógico y Diseño del Estudio" />
                            <Card className="mb-8 space-y-6 text-slate-700 leading-relaxed text-justify">
                                <h3 className="text-xl font-bold text-unitec-blue border-b pb-2">De la Transacción a la Transformación</h3>
                                <p>
                                    Históricamente, la educación en ingeniería ha estado fuertemente anclada a la adquisición de competencias duras (resolución matemática, uso de normativas y software). Sin embargo, organismos como ABET y las tendencias pedagógicas actuales señalan que este enfoque puede degenerar en un aprendizaje transaccional: el alumno busca la "respuesta correcta" exclusivamente para obtener una calificación.
                                </p>
                                <p>
                                    En respuesta a esto, UNITEC ha adoptado el **Collective Growth System (CGS)**, diseñado para trascender la enseñanza procedimental y enfocarse en la formación de *Capacidades Humanas* (Becoming Human).
                                </p>
                                
                                <h3 className="text-xl font-bold text-unitec-blue mt-8 border-b pb-2">El Reto del Análisis Estructural</h3>
                                <p>
                                    En la clase de Análisis Estructural, la principal barrera cognitiva no es la matemática, sino la *incertidumbre de la idealización*. Un ingeniero en la vida real rara vez tiene condiciones de frontera perfectas; debe asumir cargas, idealizar apoyos y tomar decisiones seguras basadas en información incompleta. El modelo tradicional de exámenes penaliza la incertidumbre, mientras que el modelo CGS, a través de simulaciones tipo *Capstone Project*, entrena al estudiante para abrazarla.
                                </p>
                                
                                <h3 className="text-xl font-bold text-unitec-blue mt-8 border-b pb-2">Metodología de Implementación</h3>
                                <p>
                                    El estudio se implementó mediante un diseño de investigación comparativo y cuasi-experimental con un grupo focal de 12 estudiantes matriculados en la asignatura Análisis Estructural (CIV324). Para analizar el impacto del sistema, a los alumnos se les otorgó la libertad de elegir su metodología de evaluación, lo que naturalmente derivó en tres trayectorias:
                                </p>
                                <ul className="list-none space-y-3 mt-4">
                                    <li className="flex gap-3">
                                        <div className="bg-unitec-blue text-white font-bold w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0">A</div>
                                        <div>
                                            <strong>Trayectoria Tradicional (4 estudiantes):</strong> Optaron exclusivamente por evaluaciones sumativas (exámenes) enfocados en el dominio mecánico y algorítmico del cálculo estructural.
                                        </div>
                                    </li>
                                    <li className="flex gap-3">
                                        <div className="bg-unitec-cyan text-white font-bold w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0">B</div>
                                        <div>
                                            <strong>Trayectoria CGS (4 estudiantes):</strong> Ejecutaron un proyecto integrador (Capstone) donde asumieron el rol de Consultores Estructurales. Modelaron un caso real (el techo del Polideportivo UNITEC) considerando cargas vivas, muertas, de sismo y viento, y utilizaron la técnica de *STAR Feedback* para co-evaluarse.
                                        </div>
                                    </li>
                                    <li className="flex gap-3">
                                        <div className="bg-slate-400 text-white font-bold w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0">C</div>
                                        <div>
                                            <strong>Trayectoria Mixta (4 estudiantes):</strong> Experimentaron una combinación de ambos métodos durante el periodo académico, permitiendo comparar los picos de ansiedad, motivación y sentido de logro generados por cada enfoque.
                                        </div>
                                    </li>
                                </ul>
                                <p className="mt-4">
                                    Los resultados fueron medidos a través de encuestas con escala de Likert y reflexiones cualitativas para determinar la efectividad en la transición hacia un pensamiento ingenieril ético e independiente.
                                </p>
                            </Card>
                        </div>
                    );
                }

                // 3. Discusión
                if (activeTab === 'discussion') {
                    return (
                        <div className="fade-in max-w-5xl mx-auto">
                            <SectionTitle title="Discusión de Resultados" subtitle="Análisis de los Hallazgos a la luz del CGS" />
                            <div className="space-y-6">
                                <Card>
                                    <h3 className="text-lg font-bold text-unitec-blue mb-3 flex items-center gap-2">
                                        <span className="bg-unitec-cyan text-white w-6 h-6 flex items-center justify-center rounded-full text-sm">1</span>
                                        El Factor Tiempo vs. Retorno de Valor
                                    </h3>
                                    <p className="text-slate-700 text-justify mb-4">
                                        Una de las barreras más citadas en la innovación educativa es la supuesta "apatía" estudiantil frente a métodos activos. Los datos de la Trayectoria A refutan esto: la principal razón para evadir el proyecto CGS fue la gestión del tiempo y la carga académica, no la falta de interés. Inversamente, el 100% de la Trayectoria B consideró que la alta inversión de tiempo valió la pena por el profundo aprendizaje profesional obtenido. Esto subraya la necesidad de balancear institucionalmente las cargas cuando se migra hacia evaluaciones auténticas.
                                    </p>
                                </Card>

                                <Card>
                                    <h3 className="text-lg font-bold text-unitec-blue mb-3 flex items-center gap-2">
                                        <span className="bg-unitec-cyan text-white w-6 h-6 flex items-center justify-center rounded-full text-sm">2</span>
                                        Del Cálculo Aislado a la Responsabilidad Ética
                                    </h3>
                                    <p className="text-slate-700 text-justify mb-4">
                                        Alineado con el perfil de "Solucionador de Problemas Empático", la evaluación CGS forzó a los estudiantes a vincular los números con la realidad física y humana. Al simular el modelado de un polideportivo real, entendieron que un fallo de cálculo por carga de viento no es un punto menos en un examen, sino un riesgo para vidas humanas. La evaluación formativa activó su *Propósito* y *Responsabilidad*.
                                    </p>
                                </Card>

                                <Card>
                                    <h3 className="text-lg font-bold text-unitec-blue mb-3 flex items-center gap-2">
                                        <span className="bg-unitec-cyan text-white w-6 h-6 flex items-center justify-center rounded-full text-sm">3</span>
                                        Seguridad Cognitiva en la Incertidumbre
                                    </h3>
                                    <p className="text-slate-700 text-justify mb-4">
                                        El modelo CGS empoderó a los estudiantes (100% en Trayectoria B) a sentirse seguros tomando decisiones de diseño con información incompleta. Pasaron de depender de una "fórmula dada por el maestro" a defender su propio "criterio ingenieril" y asumir el rol de *Colaboradores Constructivos* durante las sesiones de retroalimentación de pares.
                                    </p>
                                </Card>
                            </div>
                        </div>
                    );
                }

                // 4. Conclusiones
                if (activeTab === 'conclusion') {
                    return (
                        <div className="fade-in max-w-5xl mx-auto">
                            <SectionTitle title="Conclusiones" subtitle="Implicaciones para el Diseño Pedagógico en UNITEC" />
                            <Card className="border-t-4 border-unitec-blue">
                                <ul className="space-y-8 text-slate-700 text-justify text-lg">
                                    <li className="flex gap-4">
                                        <CheckCircle className="w-8 h-8 text-unitec-cyan flex-shrink-0 mt-1" />
                                        <div>
                                            <strong className="text-unitec-blue block text-xl mb-1">Efectividad del Modelo CGS en Ingeniería:</strong>
                                            El sistema es claramente superior al modelo tradicional para activar la responsabilidad ética intrínseca y la seguridad cognitiva en los estudiantes. Demuestra que enseñar capacidades humanas no resta rigor técnico; al contrario, le da contexto y lo refuerza profundamente.
                                        </div>
                                    </li>
                                    <li className="flex gap-4">
                                        <CheckCircle className="w-8 h-8 text-unitec-cyan flex-shrink-0 mt-1" />
                                        <div>
                                            <strong className="text-unitec-blue block text-xl mb-1">Redefinición de la Resistencia Académica:</strong>
                                            Los estudiantes de ingeniería están completamente dispuestos a asumir un alto grado de rigor y una mayor inversión de horas de trabajo si la actividad es auténtica, simula la vida real (roles de consultoría) y perciben un claro retorno de valor para su carrera.
                                        </div>
                                    </li>
                                    <li className="flex gap-4">
                                        <CheckCircle className="w-8 h-8 text-unitec-cyan flex-shrink-0 mt-1" />
                                        <div>
                                            <strong className="text-unitec-blue block text-xl mb-1">Recomendaciones Estructurales:</strong>
                                            Para escalar con éxito las metodologías basadas en el CGS, UNITEC debe contemplar la gestión del volumen de trabajo en los sílabos/planners. Las metodologías híbridas o mixtas (Trayectoria C) pueden sobrecargar cognitivamente al estudiante y generar ansiedad, siendo preferible la inmersión total apoyada en andamiajes formativos (Scaffolding).
                                        </div>
                                    </li>
                                </ul>
                            </Card>
                        </div>
                    );
                }

                // 5. Comparativa (Gráficos)
                if (activeTab === 'comparative') {
                    const currentQData = comparativeData.find(d => d.id === selectedQuestion);
                    return (
                        <div className="fade-in max-w-5xl mx-auto">
                            <SectionTitle title="Análisis Comparativo" subtitle="Comparación de percepciones sobre la adquisición de capacidades." />
                            
                            <div className="grid grid-cols-1 md:grid-cols-12 gap-6">
                                <div className="md:col-span-4 space-y-2">
                                    <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Seleccionar Indicador</label>
                                    <div className="flex flex-col gap-2 h-[450px] overflow-y-auto pr-2 custom-scrollbar">
                                        {comparativeData.map(q => (
                                            <button 
                                                key={q.id}
                                                onClick={() => setSelectedQuestion(q.id)}
                                                className={`
                                                    text-left px-4 py-3 rounded-sm border-l-4 transition-all text-sm font-medium
                                                    ${selectedQuestion === q.id 
                                                        ? 'border-unitec-cyan bg-white shadow-sm text-unitec-blue' 
                                                        : 'border-transparent text-slate-500 hover:bg-slate-100 hover:text-slate-700'
                                                    }
                                                `}
                                            >
                                                <span className="font-bold mr-2 opacity-50">{q.id}</span>
                                                {q.question}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <Card className="md:col-span-8">
                                    <div className="mb-6">
                                        <h3 className="text-lg font-bold text-unitec-blue mb-2 leading-tight">{currentQData.fullQuestion}</h3>
                                        <div className="w-12 h-1 bg-unitec-cyan mb-4"></div>
                                    </div>

                                    <div className="h-[300px] w-full">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <BarChart data={currentQData.data} layout="vertical" margin={{ top: 5, right: 30, left: 20, bottom: 5 }}>
                                                <CartesianGrid strokeDasharray="3 3" horizontal={true} vertical={false} stroke="#E2E8F0" />
                                                <XAxis type="number" domain={[0, 100]} hide />
                                                <YAxis type="category" dataKey="name" width={100} tick={{fill: '#475569', fontSize: 12, fontWeight: 600}} axisLine={false} tickLine={false} />
                                                <Tooltip 
                                                    cursor={{fill: '#F1F5F9'}}
                                                    contentStyle={{ border: 'none', boxShadow: '0 4px 6px -1px rgba(0, 0, 0, 0.1)', borderRadius: '0px' }}
                                                />
                                                <Legend iconType="square" />
                                                {currentQData.keys.map((key, index) => {
                                                    let fillColor = UNITEC_COLORS.neutral;
                                                    if (key.includes("Totalmente") || key.includes("Mismo") || key.includes("Alta")) fillColor = UNITEC_COLORS.federalBlue;
                                                    else if (key.includes("De acuerdo") || key.includes("Similar")) fillColor = UNITEC_COLORS.pacificCyan;
                                                    else if (key.includes("Cambiaría") || key.includes("Neutro")) fillColor = UNITEC_COLORS.vividSky;
                                                    
                                                    if (key.includes("más esfuerzo")) fillColor = UNITEC_COLORS.federalBlue; 
                                                    if (key.includes("menos esfuerzo")) fillColor = '#EF4444'; 

                                                    return <Bar key={key} dataKey={key} stackId="a" fill={fillColor} barSize={30} radius={[0, 4, 4, 0]} />
                                                })}
                                            </BarChart>
                                        </ResponsiveContainer>
                                    </div>
                                    
                                    {currentQData.observation && <ObservationBox text={currentQData.observation} />}
                                </Card>
                            </div>
                        </div>
                    );
                }

                // 6. Reflexiones (Cualitativas)
                if (activeTab === 'reflection') {
                    return (
                        <div className="fade-in max-w-6xl mx-auto">
                            <SectionTitle title="Reflexiones Metacognitivas" subtitle="Retroalimentación estudiantil sobre la experiencia de aprendizaje" />
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                {Object.values(reflectionData).map((item, idx) => {
                                    const borderColors = { A: 'border-t-unitec-blue', B: 'border-t-unitec-cyan', C: 'border-t-slate-400' };
                                    return (
                                        <Card key={item.id} className={`flex flex-col h-full border-t-4 ${borderColors[item.id.charAt(1)] || 'border-t-gray-400'}`}>
                                            <div className="mb-4">
                                                <span className="text-xs font-bold text-slate-400 uppercase">{item.label}</span>
                                                <h3 className="text-xl font-extrabold text-unitec-blue mt-1">{item.title}</h3>
                                            </div>
                                            
                                            <div className="flex-grow space-y-4 mb-6">
                                                {item.responses.map((resp, i) => (
                                                    <div key={i} className="relative pl-6">
                                                        <span className="absolute left-0 top-0 text-3xl text-unitec-cyan font-serif leading-3 opacity-30">“</span>
                                                        <p className="text-sm text-slate-600 italic leading-relaxed">{resp}</p>
                                                    </div>
                                                ))}
                                            </div>

                                            <div className="pt-4 border-t border-slate-100 mt-auto">
                                                <p className="text-xs text-unitec-blue font-bold uppercase mb-1">Análisis CGS:</p>
                                                <p className="text-xs text-slate-500">{item.observation}</p>
                                            </div>
                                        </Card>
                                    );
                                })}
                            </div>
                        </div>
                    );
                }

                // 7,8,9. Trayectorias A, B, C
                const data = trajectoryData[activeTab];
                if (data) {
                    const headerColors = { A: 'bg-unitec-blue', B: 'bg-unitec-cyan', C: 'bg-slate-600' };
                    return (
                        <div className="slide-up max-w-6xl mx-auto">
                            <div className={`p-8 rounded-sm text-white mb-8 shadow-md flex items-center gap-6 ${headerColors[activeTab] || 'bg-slate-700'}`}>
                                <div className="p-4 bg-white/10 rounded-full backdrop-blur-sm">
                                    {data.icon}
                                </div>
                                <div>
                                    <h2 className="text-3xl font-extrabold">{data.title}</h2>
                                    <p className="text-white/80 font-medium text-lg mt-1">{data.description}</p>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                <div className="space-y-6">
                                    {data.pieCharts.map((chart, idx) => (
                                        <Card key={idx}>
                                            <div className="flex items-center gap-2 mb-2">
                                                <h3 className="font-bold text-slate-800">{chart.title}: {chart.question}</h3>
                                            </div>
                                            
                                            <div className="h-[200px] w-full flex items-center justify-center my-4">
                                                <ResponsiveContainer width="100%" height="100%">
                                                    <PieChart>
                                                        <Pie data={chart.data} innerRadius={50} outerRadius={70} paddingAngle={5} dataKey="value">
                                                            {chart.data.map((entry, index) => (
                                                                <Cell key={`cell-${index}`} fill={PIE_COLORS[index % PIE_COLORS.length]} stroke="none" />
                                                            ))}
                                                        </Pie>
                                                        <Tooltip contentStyle={{ borderRadius: '4px', border: 'none', boxShadow: '0 2px 5px rgba(0,0,0,0.1)' }} />
                                                        <Legend verticalAlign="middle" align="right" layout="vertical" iconType="circle" />
                                                    </PieChart>
                                                </ResponsiveContainer>
                                            </div>
                                            {chart.observation && <p className="mt-4 text-sm text-center text-unitec-blue font-medium bg-blue-50 py-2 px-3 rounded-sm">{chart.observation}</p>}
                                        </Card>
                                    ))}
                                </div>
                                
                                <div className="space-y-6">
                                    {data.quotes.map((q, idx) => (
                                        <Card key={idx} className="border-l-4 border-l-unitec-vividSky">
                                            <h3 className="font-bold text-slate-800 text-lg">{q.title}</h3>
                                            <p className="text-sm text-slate-500 mb-4">{q.question}</p>
                                            <div className="space-y-3">
                                                {q.responses.map((resp, i) => (
                                                    <div key={i} className="flex gap-3">
                                                        <div className="min-w-[4px] bg-slate-200 rounded-full"></div>
                                                        <p className="text-slate-600 text-sm italic">"{resp}"</p>
                                                    </div>
                                                ))}
                                            </div>
                                            {q.observation && (
                                                <div className="mt-4 pt-4 border-t border-slate-100">
                                                    <p className="text-xs text-unitec-blue font-bold uppercase mb-1">Conexión CGS:</p>
                                                    <p className="text-xs text-slate-500">{q.observation}</p>
                                                </div>
                                            )}
                                        </Card>
                                    ))}
                                </div>
                            </div>
                        </div>
                    );
                }
                
                return null;
            };

            return (
                <div className="min-h-screen pb-12 flex flex-col">
                    {/* Header Institucional */}
                    <header className="bg-unitec-blue text-white shadow-lg sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 md:px-8 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-4">
                                <UnitecLogo />
                                <div className="hidden md:block h-8 w-px bg-white/20"></div>
                                <h1 className="hidden md:block text-sm font-semibold tracking-wider text-unitec-sky uppercase">Facultad de Ingeniería</h1>
                            </div>
                            <div className="text-right">
                                <p className="text-xs text-slate-300 font-medium uppercase tracking-widest">Estudio 2025</p>
                                <p className="text-sm font-bold">CIV324 Análisis Estructural</p>
                            </div>
                        </div>
                    </header>
                    
                    {/* Reproductor de Audio / Podcast */}
                    <div className="bg-white border-b border-slate-200 py-3 px-4 md:px-8 relative z-40">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <div className="bg-unitec-cyan/10 p-2 rounded-full">
                                    <Headphones className="w-5 h-5 text-unitec-cyan" />
                                </div>
                                <div>
                                    <span className="text-sm font-bold text-unitec-blue block">Podcast del Estudio</span>
                                    <span className="text-xs text-slate-500 font-medium">Comentarios sobre la implementación</span>
                                </div>
                            </div>
                            <audio controls className="h-10 w-full md:w-96 rounded-full outline-none shadow-sm">
                                <source src="AUD/Comentario_Piloto_de_Implementacion_CIV324.mp3" type="audio/mpeg" />
                                Tu navegador no soporta el elemento de audio.
                            </audio>
                        </div>
                    </div>

                    {/* Navegación Principal (Scroll Horizontal) */}
                    <div className="bg-white shadow-sm border-b border-slate-200 mb-8 sticky top-20 z-30">
                        <div className="max-w-7xl mx-auto px-4 md:px-8 flex overflow-x-auto custom-scrollbar">
                            <NavButton active={activeTab === 'summary'} onClick={() => setActiveTab('summary')} icon={FileText} label="Resumen" />
                            <NavButton active={activeTab === 'intro'} onClick={() => setActiveTab('intro')} icon={Compass} label="Introducción" />
                            <NavButton active={activeTab === 'comparative'} onClick={() => setActiveTab('comparative')} icon={BarChart2} label="Comparativa" />
                            <NavButton active={activeTab === 'A'} onClick={() => setActiveTab('A')} label="Trayectoria A" />
                            <NavButton active={activeTab === 'B'} onClick={() => setActiveTab('B')} label="Trayectoria B" />
                            <NavButton active={activeTab === 'C'} onClick={() => setActiveTab('C')} label="Trayectoria C" />
                            <NavButton active={activeTab === 'reflection'} onClick={() => setActiveTab('reflection')} icon={Lightbulb} label="Reflexiones" />
                            <NavButton active={activeTab === 'discussion'} onClick={() => setActiveTab('discussion')} icon={MessageSquare} label="Discusión" />
                            <NavButton active={activeTab === 'conclusion'} onClick={() => setActiveTab('conclusion')} icon={CheckCircle} label="Conclusiones" />
                        </div>
                    </div>

                    <main className="px-4 md:px-8 flex-grow">
                        {renderContent()}
                    </main>

                    <footer className="max-w-7xl mx-auto px-8 mt-12 pt-8 border-t border-slate-200 text-center text-slate-400 text-xs">
                        <p className="font-semibold text-slate-600 mb-2">Autor: Marco Tulio Canales Chavez, PhD</p>
                        <p>© 2025 Universidad Tecnológica Centroamericana (UNITEC). Todos los derechos reservados.</p>
                        <p className="mt-2">Diseñado bajo los principios del Collective Growth System (CGS).</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
