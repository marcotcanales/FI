<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Comparador de Celulares</title>
    <style>
        /* === VARIABLES & TEMA === */
        :root {
            /* Paleta de colores principal */
            --primary: #4f46e5;       /* Indigo */
            --primary-light: #818cf8;
            --primary-dark: #3730a3;
            
            /* Fondos y superficies */
            --bg-color: #f1f5f9;      /* Slate 100 */
            --surface: #ffffff;
            --surface-hover: #f8fafc;
            
            /* Texto */
            --text-main: #0f172a;     /* Slate 900 */
            --text-muted: #64748b;    /* Slate 500 */
            
            /* Bordes y UI */
            --border: #e2e8f0;        /* Slate 200 */
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            
            /* Estados */
            --success: #10b981;       /* Emerald 500 */
            --success-light: #ecfdf5;
            --success-text: #047857;
            
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-full: 9999px;
            
            /* SafeArea para notches en móviles modernos */
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* Tema Oscuro Automático */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --surface: #1e293b;
                --surface-hover: #334155;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --border: #334155;
                --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.5);
                --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4), 0 2px 4px -2px rgb(0 0 0 / 0.3);
                --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.5);
                --success: #10b981;
                --success-light: #064e3b;
                --success-text: #6ee7b7;
            }
        }

        /* === RESET & BASE === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh; /* Altura dinámica para iOS/Android */
            overflow: hidden;
            font-size: 16px;
        }

        /* === APP CONTAINER === */
        .app-layout {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 600px; /* Ancho máximo para tablets/PC, perfecto en móvil */
            margin: 0 auto;
            height: 100%;
            background-color: var(--bg-color);
            position: relative;
            box-shadow: var(--shadow-lg);
        }

        /* === HEADER === */
        header {
            background-color: rgba(var(--surface-rgb, 255, 255, 255), 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
            height: calc(64px + var(--safe-top));
            padding-top: var(--safe-top);
            display: flex;
            align-items: center;
            padding-left: 16px;
            padding-right: 16px;
            position: sticky;
            top: 0;
            z-index: 50;
            flex-shrink: 0;
        }

        .header-content {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            height: 64px;
        }

        #back-btn {
            position: absolute;
            left: -8px;
            background: none;
            border: none;
            color: var(--primary);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            visibility: hidden;
            opacity: 0;
            transition: all 0.2s ease;
            border-radius: var(--radius-full);
        }
        
        #back-btn:active {
            background-color: var(--border);
        }

        #back-btn.show {
            visibility: visible;
            opacity: 1;
            transform: translateX(8px);
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 60%;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* === CONTENEDOR PRINCIPAL === */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px calc(24px + var(--safe-bottom));
            position: relative;
            scrollbar-width: none; /* Firefox */
        }
        
        main::-webkit-scrollbar {
            display: none; /* Safari/Chrome */
        }

        /* === VISTAS Y ANIMACIONES === */
        .view {
            display: none;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .view.active {
            display: block;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* === VISTA: MARCAS === */
        .brand-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .brand-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .brand-card:active {
            transform: scale(0.97);
            background-color: var(--surface-hover);
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: 800;
            box-shadow: var(--shadow-sm);
        }

        .brand-info {
            flex: 1;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .brand-models-count {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* === VISTA: MODELOS === */
        .model-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .model-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
        }

        .model-card:active {
            transform: scale(0.97);
            background-color: var(--surface-hover);
        }

        .model-info {
            flex: 1;
            padding-right: 16px;
        }

        .model-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .model-price-range {
            font-size: 16px;
            color: var(--primary);
            font-weight: 800;
            margin-bottom: 8px;
        }

        .model-specs-tag {
            font-size: 13px;
            color: var(--text-muted);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
        }

        .chevron {
            color: var(--border);
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* === VISTA: DETALLE DE MODELO === */
        .detail-header {
            margin-bottom: 32px;
            text-align: center;
        }

        .detail-icon-wrapper {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--surface), var(--bg-color));
            border: 2px solid var(--border);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            box-shadow: var(--shadow-sm);
        }

        .detail-icon-wrapper svg {
            width: 40px;
            height: 40px;
            color: var(--primary);
        }

        .detail-title {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .detail-specs {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-muted);
            text-align: left;
            box-shadow: var(--shadow-sm);
        }
        
        .detail-specs strong {
            color: var(--text-main);
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stores-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .store-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .store-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .store-card.cheapest {
            border: 2px solid var(--success);
            background-color: var(--success-light);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
        }

        .badge-best-price {
            display: none;
        }

        .store-card.cheapest .badge-best-price {
            display: flex;
            align-items: center;
            gap: 4px;
            position: absolute;
            top: 0;
            right: 0;
            background-color: var(--success);
            color: white;
            font-size: 11px;
            font-weight: 800;
            padding: 6px 12px;
            border-bottom-left-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .store-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .store-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .store-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
        }

        .store-price {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
        }
        
        .store-card.cheapest .store-price {
            color: var(--success-text);
        }

        .store-note {
            font-size: 14px;
            color: var(--text-muted);
            background-color: var(--bg-color);
            padding: 8px 12px;
            border-radius: 8px;
            display: inline-block;
            align-self: flex-start;
            border: 1px solid var(--border);
        }
        
        /* === UPLOADER CSV === */
        .csv-uploader {
            margin-top: 40px;
            text-align: center;
            padding: 30px 20px;
            background-color: var(--surface);
            border: 2px dashed var(--border);
            border-radius: var(--radius-lg);
            transition: all 0.2s;
        }
        
        .csv-uploader:hover {
            border-color: var(--primary-light);
            background-color: var(--surface-hover);
        }
        
        .csv-uploader p {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 16px;
        }
        
        .custom-file-upload {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            cursor: pointer;
            background-color: var(--primary);
            border-radius: var(--radius-full);
            font-size: 15px;
            font-weight: 600;
            color: white;
            transition: background 0.2s, transform 0.1s;
            box-shadow: var(--shadow-md);
        }
        
        .custom-file-upload:active {
            transform: scale(0.95);
            background-color: var(--primary-dark);
        }
        
        input[type="file"] {
            display: none;
        }

    </style>
</head>

        <main>

            <div id="view-brands" class="view active">

                </div>
                
                <div class="csv-uploader">

                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>

            <!-- VISTA 2: MODELOS DE UNA MARCA -->

            <!-- VISTA 3: DETALLE DEL MODELO Y TIENDAS -->

                        </svg>

                    <h2 class="detail-title" id="detail-model-title">Nombre del Modelo</h2>
                    <div class="detail-specs" id="detail-specs-container">
                        <strong>Especificaciones</strong>
                        <span id="detail-specs-text">Especificaciones...</span>
                    </div>
                </div>
                
                <h3 class="stores-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                    Disponible en:
                </h3>
                <div class="store-list" id="store-list-container">
                    <!-- Las tiendas se generan dinámicamente aquí -->
                </div>
            </div>
        </main>
    </div>

        // === ESTADO DE LA APP ===
        let appData = {};
        let currentView = 'brands'; 
        let viewStack = [{ id: 'brands', title: 'Comparador' }];

        // Referencias al DOM
        const views = {
            brands: document.getElementById('view-brands'),
            models: document.getElementById('view-models'),
            details: document.getElementById('view-details')
        };
        const headerTitle = document.getElementById('header-title');
        const backBtn = document.getElementById('back-btn');
        const csvFileInput = document.getElementById('csvFileInput');

        // Formateador de moneda para Lempiras
        const formatCurrency = (value) => {
            return 'L ' + value.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        // Generador de colores consistentes para marcas
        const getBrandColor = (brandName) => {
            const colors = [
                'linear-gradient(135deg, #3b82f6, #1d4ed8)', // Blue
                'linear-gradient(135deg, #10b981, #047857)', // Green
                'linear-gradient(135deg, #f59e0b, #b45309)', // Amber
                'linear-gradient(135deg, #ec4899, #be185d)', // Pink
                'linear-gradient(135deg, #8b5cf6, #6d28d9)', // Purple
                'linear-gradient(135deg, #14b8a6, #0f766e)'  // Teal
            ];
            // Crear un hash simple a partir del nombre
            let hash = 0;
            for (let i = 0; i < brandName.length; i++) {
                hash = brandName.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        };

        // === LÓGICA DE NAVEGACIÓN ===
        function navigateTo(viewId, title) {
            Object.values(views).forEach(v => {
                v.classList.remove('active');
            });
            
            // Forzar reflow para reiniciar la animación
            void views[viewId].offsetWidth; 
            views[viewId].classList.add('active');
            
            headerTitle.textContent = title;
            currentView = viewId;

            if (viewStack[viewStack.length - 1].id !== viewId) {
                viewStack.push({ id: viewId, title: title });
            }

            updateBackButton();
            document.querySelector('main').scrollTop = 0;
        }

        function navigateBack() {
            if (viewStack.length > 1) {
                viewStack.pop();
                const previous = viewStack[viewStack.length - 1];
                
                Object.values(views).forEach(v => v.classList.remove('active'));
                
                void views[previous.id].offsetWidth;
                views[previous.id].classList.add('active');
                
                headerTitle.textContent = previous.title;
                currentView = previous.id;
                
                updateBackButton();
            }
        }

        function updateBackButton() {
            if (viewStack.length > 1) {
                backBtn.classList.add('show');
            } else {
                backBtn.classList.remove('show');
            }
        }

        backBtn.addEventListener('click', navigateBack);

        // === LÓGICA DE DATOS (CSV) ===
        function parseCSV(str) {
            const arr = [];
            let quote = false;
            let row = 0, col = 0;
            for (let c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || '';

                if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
                if (cc == '"') { quote = !quote; continue; }
                if (cc == ',' && !quote) { ++col; continue; }
                if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if (cc == '\n' && !quote) { ++row; col = 0; continue; }
                if (cc == '\r' && !quote) { ++row; col = 0; continue; }

                arr[row][col] += cc;
            }
            return arr;
        }

        function processCSVData(csvString) {
            const parsed = parseCSV(csvString.trim());
            if (parsed.length < 2) return;
            
            const headers = parsed[0].map(h => h.trim().toLowerCase());
            
            const iModel = headers.indexOf('model');
            const iBrand = headers.indexOf('brand');
            const iStore = headers.indexOf('store');
            const iPrice = headers.indexOf('price');
            const iSpecs = headers.indexOf('specs');
            const iNote = headers.indexOf('note');

            appData = {};

            for (let i = 1; i < parsed.length; i++) {
                const row = parsed[i];
                if (!row || row.length < headers.length) continue;

                const brand = row[iBrand].trim();
                const model = row[iModel].trim();
                const store = row[iStore].trim();
                const price = parseFloat(row[iPrice].replace(/[^0-9.-]+/g, "")) || 0;
                const specs = row[iSpecs] ? row[iSpecs].trim() : "Sin especificaciones detalladas";
                const note = row[iNote] ? row[iNote].trim() : "";

                if (!appData[brand]) appData[brand] = {};
                if (!appData[brand][model]) appData[brand][model] = [];

                appData[brand][model].push({ store, price, specs, note });
            }

            renderBrands();
        }

        csvFileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const contents = event.target.result;
                
                try {
                    localStorage.setItem('savedCellphonesCSV', contents);
                    const notice = document.getElementById('storage-notice');
                    notice.style.display = 'flex';
                } catch (err) {
                    console.warn("No se pudo guardar en localStorage", err);
                }

                processCSVData(contents);
            };
            reader.readAsText(file);
        });

        // === RENDERIZADO DE INTERFAZ ===
        function renderBrands() {
            const container = document.getElementById('brand-grid-container');
            container.innerHTML = '';
            
            const brands = Object.keys(appData).sort();

            brands.forEach(brand => {
                const modelCount = Object.keys(appData[brand]).length;
                const initial = brand.charAt(0).toUpperCase();
                const bgColor = getBrandColor(brand);
                
                const btn = document.createElement('div');
                btn.className = 'brand-card';
                btn.innerHTML = `
                    <div class="brand-icon" style="background: ${bgColor}">${initial}</div>
                    <div class="brand-info">
                        <div class="brand-name">${brand}</div>
                        <div class="brand-models-count">${modelCount} modelo${modelCount !== 1 ? 's' : ''} disponibles</div>
                    </div>
                    <div class="chevron">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </div>
                `;
                
                btn.addEventListener('click', () => {
                    renderModels(brand);
                });

                container.appendChild(btn);
            });

            viewStack = [{ id: 'brands', title: 'Comparador' }];
            navigateTo('brands', 'Comparador');
        }

        function renderModels(brand) {
            const container = document.getElementById('model-list-container');
            container.innerHTML = '';

            const models = appData[brand];
            const modelNames = Object.keys(models).sort();

            modelNames.forEach(modelName => {
                const stores = models[modelName];
                
                const prices = stores.map(s => s.price);
                const minPrice = Math.min(...prices);
                const maxPrice = Math.max(...prices);
                
                let priceText = formatCurrency(minPrice);
                if (minPrice !== maxPrice) {
                    priceText = `Desde ${formatCurrency(minPrice)}`;
                }

                let bestSpecs = stores.reduce((a, b) => a.specs.length > b.specs.length ? a : b).specs;

                const card = document.createElement('div');
                card.className = 'model-card';
                card.innerHTML = `
                    <div class="model-info">
                        <div class="model-title">${modelName}</div>
                        <div class="model-price-range">${priceText}</div>
                        <div class="model-specs-tag">${bestSpecs}</div>
                    </div>
                    <div class="chevron">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </div>
                `;

                card.addEventListener('click', () => {
                    renderModelDetails(brand, modelName);
                });

                container.appendChild(card);
            });

            navigateTo('models', brand);
        }

        function renderModelDetails(brand, modelName) {
            document.getElementById('detail-model-title').textContent = modelName;
            
            const stores = appData[brand][modelName];
            stores.sort((a, b) => a.price - b.price);
            const minPrice = stores[0].price; 
            
            let bestSpecs = stores.reduce((a, b) => a.specs.length > b.specs.length ? a : b).specs;
            document.getElementById('detail-specs-text').textContent = bestSpecs;

            const container = document.getElementById('store-list-container');
            container.innerHTML = '';

            stores.forEach(storeObj => {
                const isCheapest = storeObj.price === minPrice;
                
                const card = document.createElement('div');
                card.className = `store-card ${isCheapest ? 'cheapest' : ''}`;
                
                let noteHtml = '';
                if (storeObj.note) {
                    noteHtml = `<div class="store-note">${storeObj.note}</div>`;
                }

                card.innerHTML = `
                    <div class="badge-best-price">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
                        Mejor Opción
                    </div>
                    <div class="store-header">
                        <div class="store-info">
                            <span class="store-name">${storeObj.store}</span>
                            <span class="store-price">${formatCurrency(storeObj.price)}</span>
                        </div>
                    </div>
                    ${noteHtml}
                `;
                
                container.appendChild(card);
            });

            navigateTo('details', modelName);
        }

        // === INICIALIZACIÓN ===
        window.addEventListener('DOMContentLoaded', () => {
            const savedCSV = localStorage.getItem('savedCellphonesCSV');
            
            if (savedCSV) {
                processCSVData(savedCSV);
                const notice = document.getElementById('storage-notice');
                notice.style.display = 'flex';
            } else {
                processCSVData(defaultCSV);
            }
        });

    </script>
