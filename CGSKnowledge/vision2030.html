<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #06065C;
            color: #FFFFFF;
            overflow-x: hidden;
        }

        .diamond-bg {
            background-image: radial-gradient(#06065C 20%, transparent 20%),
            radial-gradient(rgba(3, 174, 210, 0.2) 20%, transparent 20%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #06065C;
        }
        ::-webkit-scrollbar-thumb {
            background: #03AED2;
            border-radius: 4px;
        }

        .venn-circle {
            transition: all 0.5s ease;
        }
        .venn-circle:hover {
            transform: scale(1.05);
            z-index: 10;
            background-color: rgba(3, 174, 210, 0.2);
            border-color: #47C8FD;
        }

        /* Animations */
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 60s linear infinite;
        }

        /* Modal specific animations */
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fade-in-up 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICONOS INCRUSTADOS (ZERO DEPENDENCIES) ---

                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {children}

        );

            Menu: (props) => <IconBase {...props}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></IconBase>,

                },

             const ecosystemData = [

                                            <ul className="space-y-4">
                                                {eje.impacts.map((impact, i) => (
                                                    <li key={i} className="flex items-start gap-3 text-gray-300">
                                                        <div className="mt-1.5 w-1.5 h-1.5 bg-[#47C8FD] rotate-45 flex-shrink-0"></div>
                                                        <span className="text-sm">{impact}</span>
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* RETRATO SECTION - MODIFIED FOR INTERACTIVITY */}
                    <section id="retrato" className="py-32 relative bg-gradient-to-b from-[#05054B] to-[#06065C] overflow-hidden">
                        <div className="container mx-auto px-6 relative z-10">
                            <div className="text-center mb-12 md:mb-24">
                                <h2 className="text-3xl md:text-4xl font-bold mb-4 text-white">Retrato del Egresado</h2>
                                <p className="text-gray-300 max-w-2xl mx-auto text-sm md:text-base mb-2">
                                    Nuestro modelo forma profesionales integrales, definidos por capacidades humanas conectadas a un núcleo equilibrado.
                                </p>
                                <p className="text-[#47C8FD] font-semibold text-sm">
                                    Haz clic en cada capacidad para conocer su definición.
                                </p>
                            </div>

                            <div className="relative w-full max-w-5xl mx-auto min-h-[400px] md:min-h-[600px] flex items-center justify-center">
                                {/* MOBILE SCALE FIX: scale-[0.65] to prevent cut-off */}
                                <div className="relative w-[300px] h-[300px] md:w-[450px] md:h-[450px] transform scale-[0.65] sm:scale-75 md:scale-100 transition-transform duration-500 origin-center">
                                    
                                    {/* Outer Orbit Rings */}
                                    <div className="absolute inset-[-40px] md:inset-[-60px] border border-[#03AED2]/20 rounded-full animate-spin-slow"></div>
                                    <div className="absolute inset-[20px] md:inset-[30px] border border-[#47C8FD]/10 rounded-full"></div>
                                    
                                    {/* Radial Lines */}
                                    <div className="absolute inset-[-20px] md:inset-[-30px]">
                                        {[0, 60, 120, 180, 240, 300].map((deg) => (
                                            <div key={deg} className="absolute top-1/2 left-1/2 w-full h-px bg-[#03AED2]/10 -translate-y-1/2 -translate-x-1/2" style={{ transform: `translate(-50%, -50%) rotate(${deg}deg)` }}></div>
                                        ))}
                                    </div>

                                    {/* The 6 Capabilities (Nodes) - Clickable */}
                                    {portraitCapabilities.map((cap, idx) => (
                                        <div 
                                            key={idx} 
                                            className={`absolute ${cap.pos} flex flex-col items-center group z-20 cursor-pointer`}
                                            onClick={() => setSelectedCapability(cap)}
                                            role="button"
                                            tabIndex="0"
                                        >
                                            <div className="relative">
                                                <div className={`w-14 h-14 md:w-20 md:h-20 bg-[#06065C] border-2 ${selectedCapability?.title === cap.title ? 'border-white bg-[#03AED2] text-white' : 'border-[#03AED2] text-[#47C8FD]'} rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(3,174,210,0.3)] group-hover:bg-[#03AED2] group-hover:text-white transition-all duration-300 relative z-10`}>
                                                    {cap.icon}
                                                </div>
                                                <div className={`absolute ${cap.labelPos} w-32 md:w-auto text-center whitespace-normal md:whitespace-nowrap bg-[#06065C]/95 px-3 py-1.5 rounded border ${selectedCapability?.title === cap.title ? 'border-white' : 'border-[#03AED2]/30'} backdrop-blur-md z-30 shadow-xl`}>
                                                    <span className={`text-xs md:text-sm font-bold ${selectedCapability?.title === cap.title ? 'text-[#47C8FD]' : 'text-white'} group-hover:text-[#47C8FD] transition-colors leading-tight block`}>
                                                        {cap.title}
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    ))}

                                    {/* CENTER CORE */}
                                    <div className="absolute top-1/2 left-1/2 w-56 h-56 md:w-72 md:h-72 bg-[#06065C] border-4 border-[#03AED2] rounded-full -translate-x-1/2 -translate-y-1/2 flex items-center justify-center z-10 shadow-[0_0_60px_rgba(3,174,210,0.4)] pointer-events-none">
                                        <div className="absolute inset-3 border border-[#47C8FD]/30 rounded-full"></div>
                                        <div className="relative w-full h-full">
                                            {/* Conceptos */}
                                            <div className="absolute top-[15%] left-1/2 -translate-x-1/2 text-center w-full">
                                                <div className="text-[#03AED2] mb-1 flex justify-center"><BookOpen size={20} /></div>
                                                <span className="text-sm md:text-lg font-bold text-white tracking-wider uppercase">Conceptos</span>
                                            </div>
                                            {/* Competencias */}
                                            <div className="absolute bottom-[20%] right-[10%] text-center w-[45%]">
                                                <div className="text-[#03AED2] mb-1 flex justify-center"><Award size={20} /></div>
                                                <span className="text-xs md:text-sm font-bold text-white tracking-wider uppercase block">Competencias</span>
                                            </div>
                                            {/* Carácter */}
                                            <div className="absolute bottom-[20%] left-[10%] text-center w-[45%]">
                                                <div className="text-[#03AED2] mb-1 flex justify-center"><Target size={20} /></div>
                                                <span className="text-xs md:text-sm font-bold text-white tracking-wider uppercase block">Carácter</span>
                                            </div>
                                            {/* Divider */}
                                            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full opacity-20 pointer-events-none">
                                                <div className="absolute top-1/2 left-1/2 w-px h-[40%] bg-white -translate-x-1/2 -translate-y-full"></div>
                                                <div className="absolute top-1/2 left-1/2 w-px h-[40%] bg-white -translate-x-1/2 origin-top rotate-[120deg]"></div>
                                                <div className="absolute top-1/2 left-1/2 w-px h-[40%] bg-white -translate-x-1/2 origin-top rotate-[-120deg]"></div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                </div>
                            </div>
                        </div>

                        {/* MODAL / PANEL DE DEFINICIÓN (Opción A: Seguro y Clásico) */}
                        {selectedCapability && (
                            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
                                {/* Backdrop */}
                                <div 
                                    className="absolute inset-0 bg-[#040435]/80 backdrop-blur-sm cursor-pointer transition-opacity"
                                    onClick={() => setSelectedCapability(null)}
                                ></div>
                                
                                {/* Modal Content - Diamond precise cuts inspired */}
                                <div className="relative bg-[#06065C] border border-[#03AED2] p-8 md:p-10 max-w-2xl w-full shadow-[0_0_50px_rgba(3,174,210,0.2)] animate-fade-in-up z-10">
                                    {/* Esquinas decorativas estilo diamante */}
                                    <div className="absolute -top-1 -left-1 w-6 h-6 border-t-2 border-l-2 border-[#47C8FD]"></div>
                                    <div className="absolute -bottom-1 -right-1 w-6 h-6 border-b-2 border-r-2 border-[#47C8FD]"></div>
                                    
                                    <button 
                                        className="absolute top-4 right-4 text-[#03AED2] hover:text-white transition-colors"
                                        onClick={() => setSelectedCapability(null)}
                                        aria-label="Cerrar"
                                    >
                                        <X size={28} />
                                    </button>

                                    <div className="flex items-center gap-4 mb-6 pb-6 border-b border-[#03AED2]/20">
                                        <div className="p-3 bg-[#03AED2]/10 rounded-sm text-[#47C8FD]">
                                            {selectedCapability.icon}
                                        </div>
                                        <h3 className="text-2xl md:text-3xl font-bold text-white uppercase tracking-wide">
                                            {selectedCapability.title}
                                        </h3>
                                    </div>
                                    
                                    <p className="text-gray-200 font-light leading-relaxed text-base md:text-lg">
                                        {selectedCapability.desc}
                                    </p>

                                    <div className="mt-8 flex justify-end">
                                         <button 
                                            onClick={() => setSelectedCapability(null)}
                                            className="px-6 py-2 bg-transparent border border-[#03AED2] text-[#47C8FD] hover:bg-[#03AED2] hover:text-[#06065C] font-semibold transition-all duration-300 text-sm tracking-wider uppercase"
                                        >
                                            Entendido
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </section>

                    {/* ECOSISTEMA DE APRENDIZAJE */}
                    <section id="ecosistema" className="py-24 bg-[#040435] relative">
                        <div className="container mx-auto px-6">
                            <div className="text-center mb-16">
                                <div className="inline-block px-3 py-1 border border-[#47C8FD] rounded-full text-[#47C8FD] text-xs font-bold tracking-widest uppercase mb-4">Modelo CGS</div>
                                <h2 className="text-3xl md:text-4xl font-bold text-white mb-6">Ecosistema de Aprendizaje UNITEC</h2>
                                <p className="text-lg md:text-xl text-gray-300">Las 4 Dimensiones</p>
                            </div>

                            <div className="flex flex-col lg:flex-row gap-16 items-center">
                                {/* Left Column: List */}
                                <div className="w-full lg:w-1/2 space-y-8">
                                    {ecosystemData.map((item, idx) => (
                                        <div key={idx} className="flex gap-4 md:gap-6 group">
                                            <div className="flex-shrink-0">
                                                <div className="w-12 h-12 md:w-14 md:h-14 bg-[#06065C] border border-[#03AED2] rounded-full flex items-center justify-center text-white shadow-lg group-hover:bg-[#03AED2] transition-colors duration-300">
                                                    {item.icon}
                                                </div>
                                                {idx !== ecosystemData.length - 1 && (
                                                    <div className="w-px h-full bg-[#03AED2]/20 mx-auto my-2"></div>
                                                )}
                                            </div>
                                            <div>
                                                <h3 className="text-lg md:text-xl font-bold text-white mb-1 flex flex-wrap items-center gap-2">
                                                    {item.title} <span className="text-[#47C8FD] text-xs md:text-sm font-normal uppercase tracking-wider">- "{item.subtitle}"</span>
                                                </h3>
                                                <p className="text-gray-300 text-sm leading-relaxed mb-2">{item.desc}</p>
                                                <p className="text-[#03AED2] text-xs italic">{item.detail}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {/* Right Column: Visual Venn Diagram */}
                                <div className="w-full lg:w-1/2 flex items-center justify-center relative min-h-[400px] md:min-h-[500px]">
                                    <div className="relative w-full max-w-[350px] md:max-w-[500px] aspect-square transform scale-90 md:scale-100">
                                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-24 h-24 md:w-32 md:h-32 bg-white z-20 rounded-full flex items-center justify-center shadow-[0_0_40px_rgba(255,255,255,0.3)] text-center p-2 md:p-4">
                                            <span className="text-[#06065C] font-bold text-xs md:text-sm leading-tight">Aprendizaje Profundo</span>
                                        </div>
                                        <div className="absolute top-0 left-1/2 -translate-x-1/2 w-48 h-48 md:w-64 md:h-64 bg-[#03AED2]/20 border border-[#03AED2] rounded-full venn-circle flex items-start justify-center pt-6 md:pt-8 backdrop-blur-sm">
                                            <span className="font-bold text-white uppercase tracking-widest text-xs md:text-sm">Comunidad</span>
                                        </div>
                                        <div className="absolute bottom-0 left-1/2 -translate-x-1/2 w-48 h-48 md:w-64 md:h-64 bg-[#47C8FD]/20 border border-[#47C8FD] rounded-full venn-circle flex items-end justify-center pb-6 md:pb-8 backdrop-blur-sm">
                                            <span className="font-bold text-white uppercase tracking-widest text-xs md:text-sm">Cultura</span>
                                        </div>
                                        <div className="absolute left-0 top-1/2 -translate-y-1/2 w-48 h-48 md:w-64 md:h-64 bg-[#06065C]/40 border border-[#ffffff]/30 rounded-full venn-circle flex items-center justify-start pl-6 md:pl-8 backdrop-blur-sm">
                                            <span className="font-bold text-white uppercase tracking-widest text-xs md:text-sm transform -rotate-90">Contexto</span>
                                        </div>
                                        <div className="absolute right-0 top-1/2 -translate-y-1/2 w-48 h-48 md:w-64 md:h-64 bg-[#03AED2]/10 border border-[#ffffff]/30 rounded-full venn-circle flex items-center justify-end pr-6 md:pr-8 backdrop-blur-sm">
                                            <span className="font-bold text-white uppercase tracking-widest text-xs md:text-sm transform rotate-90">Currículo</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* FOOTER */}
                    <footer className="bg-[#040435] text-white py-12 border-t border-white/5">
                        <div className="container mx-auto px-6 text-center">
                            <div className="flex items-center justify-center gap-3 mb-8 opacity-80">
                                <div className="w-6 h-6 bg-[#03AED2] rotate-45"></div>
                                <span className="text-xl font-bold tracking-tight">unitec</span>
                            </div>
                            <p className="text-gray-400 text-sm mb-4">
                                © 2030 Universidad Tecnológica Centroamericana. Todos los derechos reservados.
                            </p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
