                    </div>

                    {/* Detalle de Herramientas */}
                    <div className="w-full lg:w-2/3 xl:w-3/4">
                        {activeStrand && (
                            <div className="space-y-8">
                                <div className="bg-white rounded-lg shadow-sm border border-slate-200 p-8 relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-64 h-64 bg-slate-50 rounded-full mix-blend-multiply filter blur-3xl opacity-70 -mr-10 -mt-10"></div>
                                    <div className="relative z-10">
                                        <div className="flex items-center gap-4 mb-6">
                                            <div className="p-3 bg-unitec-blue rounded-lg text-white shadow-lg">
                                                <IconRenderer name={activeStrand.icon} className="h-8 w-8" />
                                            </div>
                                            <h2 className="text-3xl font-bold text-unitec-blue">{activeStrand.name}</h2>
                                        </div>
                                        <p className="text-lg text-slate-600 max-w-4xl border-l-4 border-unitec-sky pl-4">{activeStrand.description}</p>
                                    </div>
                                </div>
                                
                                <div className="grid gap-8">
                                    {activeStrand.tools.map((tool, idx) => (
                                        <div key={idx} className="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-shadow">
                                            {/* Tool Header */}
                                            <div className="bg-slate-50 p-6 border-b border-slate-100 flex flex-col md:flex-row md:items-start md:justify-between gap-4">
                                                <div>
                                                    <div className="flex items-center gap-3 mb-3">
                                                        <span className="px-3 py-1 bg-unitec-blue text-white text-xs font-bold uppercase rounded tracking-wider">Herramienta {idx + 1}</span>
                                                        <div className="flex items-center gap-1 text-slate-500 text-xs font-semibold uppercase tracking-wide">
                                                            <IconRenderer name="Clock" className="w-3 h-3" /> {tool.time}
                                                        </div>
                                                    </div>
                                                    <h3 className="text-2xl font-bold text-slate-800">{tool.name}</h3>
                                                </div>
                                            </div>

                                            <div className="p-8 space-y-8">
                                                {/* Pregunta y Propósito */}
                                                <div className="grid md:grid-cols-2 gap-8">
                                                    <div className="bg-blue-50 p-6 rounded-lg border-l-4 border-unitec-blue">
                                                        <h4 className="flex items-center gap-2 text-sm font-bold text-unitec-blue uppercase tracking-wider mb-3">
                                                            <IconRenderer name="HelpCircle" className="w-4 h-4" /> Pregunta Convincente
                                                        </h4>
                                                        <p className="text-slate-700 italic font-medium">"{tool.question}"</p>
                                                    </div>
                                                    <div className="bg-cyan-50 p-6 rounded-lg border-l-4 border-unitec-cyan">
                                                        <h4 className="flex items-center gap-2 text-sm font-bold text-cyan-800 uppercase tracking-wider mb-3">
                                                            <IconRenderer name="Zap" className="w-4 h-4" /> Propósito
                                                        </h4>
                                                        <p className="text-slate-700">{tool.purpose}</p>
                                                    </div>
                                                </div>

                                                {/* Metodología */}
                                                <div>
                                                    <h4 className="text-sm font-bold text-slate-900 uppercase tracking-widest mb-6 flex items-center gap-2 border-b pb-2">
                                                        <IconRenderer name="Layers" className="w-4 h-4 text-slate-400" /> Metodología Paso a Paso
                                                    </h4>
                                                    <div className="space-y-4">
                                                        {tool.methodology.map((step, sIdx) => (
                                                            <div key={sIdx} className="flex gap-6 group">
                                                                <div className="flex-shrink-0 w-8 h-8 rounded-full bg-white border-2 border-unitec-blue text-unitec-blue font-bold flex items-center justify-center text-sm shadow-sm group-hover:bg-unitec-blue group-hover:text-white transition-all">
                                                                    {sIdx + 1}
                                                                </div>
                                                                <div className="flex-grow pt-1">
                                                                    <span className="block font-bold text-unitec-blue text-sm mb-1 uppercase tracking-wide">{step.phase}</span>
                                                                    <p className="text-sm text-slate-600">{step.action}</p>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>

                                                {/* Recursos */}
                                                <div className="pt-4 border-t border-slate-100 flex items-start gap-3 text-sm text-slate-500">
                                                    <IconRenderer name="Box" className="w-5 h-5 mt-0.5 text-unitec-sky" />
                                                    <p><span className="font-bold text-slate-700">Recursos necesarios:</span> {tool.resources}</p>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const JsonView = () => (
            <div className="space-y-8 animate-fadeIn">
                <div className="bg-unitec-blue p-10 rounded-lg shadow-xl text-white relative overflow-hidden">
                     <div className="absolute -right-10 -top-10 text-white/5 transform rotate-12">
                         <IconRenderer name="Diamond" className="w-64 h-64" />
                     </div>
                    <div className="flex flex-col md:flex-row items-start justify-between relative z-10">
                        <div>
                            <h2 className="text-2xl font-bold flex items-center gap-3">
                                <IconRenderer name="Database" className="h-6 w-6 text-unitec-cyan" />
                                Base de Conocimiento JSON
                            </h2>
                            <p className="text-blue-200 mt-4 max-w-2xl leading-relaxed">
                                Este objeto contiene la totalidad del marco teórico y práctico. 
                                Ideal para alimentar agentes RAG (Retrieval-Augmented Generation) o para integraciones directas.
                            </p>
                        </div>
                        <button 
                            onClick={() => {navigator.clipboard.writeText(JSON.stringify(learningData, null, 2))}}
                            className="mt-6 md:mt-0 bg-unitec-cyan hover:bg-cyan-400 text-unitec-blue px-8 py-3 rounded font-bold shadow-lg transition-all flex items-center gap-2"
                        >
                            <IconRenderer name="CheckCircle" className="h-5 w-5" />
                            Copiar Datos
                        </button>
                    </div>
                </div>

                <div className="relative group rounded-lg overflow-hidden border border-slate-200 shadow-sm">
                    <div className="absolute top-0 left-0 right-0 bg-slate-100 px-4 py-2 border-b border-slate-200 flex justify-between items-center">
                        <span className="text-xs font-bold text-slate-500 uppercase tracking-widest">learningData.json</span>
                        <span className="text-xs font-mono text-slate-400">readonly</span>
                    </div>
                    <pre className="bg-white text-slate-600 p-8 pt-14 text-xs font-mono max-h-[800px] overflow-y-auto custom-scrollbar leading-relaxed">
                        {JSON.stringify(learningData, null, 2)}
                    </pre>
                </div>
            </div>
        );

        function App() {
            const [activeTab, setActiveTab] = useState('continuum');

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 font-sans pb-16">
                    <Header activeTab={activeTab} setActiveTab={setActiveTab} />
                    
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-12">
                        {activeTab === 'continuum' && <ContinuumView />}
                        {activeTab === 'tools' && <ToolsView />}
                        {activeTab === 'ai-data' && <JsonView />}
                    </main>

                    <footer className="max-w-7xl mx-auto px-4 mt-24 pt-8 border-t border-slate-200 text-center text-slate-400 text-sm">
                        <div className="flex justify-center items-center gap-2 mb-2">
                             <div className="w-2 h-2 bg-unitec-blue rotate-45"></div>
                             <div className="w-2 h-2 bg-unitec-cyan rotate-45"></div>
                             <div className="w-2 h-2 bg-unitec-sky rotate-45"></div>
                        </div>
                        <p className="font-semibold text-unitec-blue">© 2024 Learning to Learn Framework</p>
                        <p className="mt-2 text-xs uppercase tracking-wider">Diseñado bajo lineamientos Manual de Marca UNITEC</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
