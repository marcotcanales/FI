        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

</head>

        const Quote = ({ className }) => <IconWrapper className={className}><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/></IconWrapper>;
        const BarChart2 = ({ className }) => <IconWrapper className={className}><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></IconWrapper>;
        const AlertCircle = ({ className }) => <IconWrapper className={className}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></IconWrapper>;
        const Lightbulb = ({ className }) => <IconWrapper className={className}><line x1="9" x2="15" y1="18" y2="18"/><line x1="10" x2="14" y1="22" y2="22"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 12 2a4.65 4.65 0 0 0-4.5 9.65c.76.76 1.23 1.52 1.4 2.5a2 2 0 0 0 4.19 0Z"/></IconWrapper>;

        // --- UNITEC COLOR PALETTE ---
        const UNITEC_COLORS = {
            federalBlue: '#06065C', // Main, Dark
            pacificCyan: '#03AED2', // Action, Vibrant
            vividSky: '#47C8FD',    // Light Accent
            neutral: '#CBD5E1',     // Blue-Gray (Slate 300)
            white: '#FFFFFF',
            darkText: '#0F172A',
        };

        const PIE_COLORS = [UNITEC_COLORS.federalBlue, UNITEC_COLORS.pacificCyan, UNITEC_COLORS.vividSky, UNITEC_COLORS.neutral];

        // --- DATA (ENGLISH) ---
        const comparativeData = [
            { 
                id: "L1", 
                question: "Deep Understanding", 
                fullQuestion: "I feel I understand why structures behave the way they do, beyond simply knowing how to use formulas or software.",
                observation: "The CGS assessment achieved 100% perception in deep understanding. The mixed methodology was the least effective in this aspect.",
                data: [ { name: 'Trajectory A', 'Strongly Agree': 66, 'Agree': 0, 'Neutral': 33 }, { name: 'Trajectory B', 'Strongly Agree': 100, 'Agree': 0, 'Neutral': 0 }, { name: 'Trajectory C', 'Strongly Agree': 0, 'Agree': 100, 'Neutral': 0 } ], keys: ['Strongly Agree', 'Agree', 'Neutral'] 
            },
            { 
                id: "L2", 
                question: "Idealization vs. Math", 
                fullQuestion: "The assessment helped me understand that Structural Analysis is a process of idealization (where my judgment defines geometry and loads) and not just an exact mathematical process.",
                observation: "The CGS assessment reached 100% perception regarding concept idealization, while the traditional assessment obtained the lowest results.",
                data: [ { name: 'Trajectory A', 'Strongly Agree': 33, 'Agree': 33, 'Neutral': 33 }, { name: 'Trajectory B', 'Strongly Agree': 100, 'Agree': 0, 'Neutral': 0 }, { name: 'Trajectory C', 'Strongly Agree': 50, 'Agree': 50, 'Neutral': 0 } ], keys: ['Strongly Agree', 'Agree', 'Neutral'] 
            },
            { 
                id: "L3", 
                question: "Decision Making", 
                fullQuestion: "I feel capable of making design decisions (like assuming a live load or support type) even when I don't have perfect or complete information.",
                observation: "The CGS assessment obtained the best perception in design decision-making capacity. The mixed methodology was the least effective.",
                data: [ { name: 'Trajectory A', 'Strongly Agree': 33, 'Agree': 33, 'Neutral': 33 }, { name: 'Trajectory B', 'Strongly Agree': 50, 'Agree': 50, 'Neutral': 0 }, { name: 'Trajectory C', 'Strongly Agree': 0, 'Agree': 100, 'Neutral': 0 } ], keys: ['Strongly Agree', 'Agree', 'Neutral'] 
            },
            { 
                id: "L4", 
                question: "Real Use & Safety", 
                fullQuestion: "I feel the assessment made me consider the real use, safety, and needs of the people who will inhabit the structure (e.g., when calculating Wind or Seismic Loads).",
                observation: "100% of students evaluated with CGS perceived that safety aspects and the needs of future inhabitants were taken into account.",
                data: [ { name: 'Trajectory A', 'Strongly Agree': 66, 'Agree': 33, 'Neutral': 0 }, { name: 'Trajectory B', 'Strongly Agree': 100, 'Agree': 0, 'Neutral': 0 }, { name: 'Trajectory C', 'Strongly Agree': 0, 'Agree': 0, 'Neutral': 100 } ], keys: ['Strongly Agree', 'Agree', 'Neutral'] 
            },
            { 
                id: "L5", 
                question: "Ethical Responsibility", 
                fullQuestion: "I felt the ethical responsibility that my calculations (or my model) directly impact public safety and code compliance (CHOC).",
                observation: "Both CGS and traditional assessments obtained 100% in perception of ethical responsibility. The mixed approach was the least effective.",
                data: [ { name: 'Trajectory A', 'Strongly Agree': 100, 'Agree': 0 }, { name: 'Trajectory B', 'Strongly Agree': 100, 'Agree': 0 }, { name: 'Trajectory C', 'Strongly Agree': 50, 'Agree': 50 } ], keys: ['Strongly Agree', 'Agree'] 
            },
            { 
                id: "L6", 
                question: "Applicability", 
                fullQuestion: "I feel I can apply what I learned in this assessment to completely new situations or other courses in my degree.",
                observation: "Both assessments (CGS and traditional) achieved 100% regarding the applicability of what was learned to new situations.",
                data: [ { name: 'Trajectory A', 'Strongly Agree': 100, 'Agree': 0 }, { name: 'Trajectory B', 'Strongly Agree': 100, 'Agree': 0 }, { name: 'Trajectory C', 'Strongly Agree': 0, 'Agree': 100 } ], keys: ['Strongly Agree', 'Agree'] 
            },
            { 
                id: "L7", 
                question: "Perceived Effort", 
                fullQuestion: "Compared to the other assessment option available, I feel my choice required:",
                observation: "Students in the CGS method perceived significantly higher effort. In the traditional assessment, the perception was of similar effort to their peers, while in the mixed method, similar or lower effort was perceived.",
                data: [ { name: 'Trajectory A', 'Similar Effort': 100, 'Much More Effort': 0, 'Much Less Effort': 0 }, { name: 'Trajectory B', 'Similar Effort': 50, 'Much More Effort': 50, 'Much Less Effort': 0 }, { name: 'Trajectory C', 'Similar Effort': 50, 'Much More Effort': 0, 'Much Less Effort': 50 } ], keys: ['Much More Effort', 'Similar Effort', 'Much Less Effort'] 
            },
            { 
                id: "L8", 
                question: "Future Choice", 
                fullQuestion: "If you could take the course again, would you choose the same assessment method?",
                observation: "100% of CGS method students would choose this methodology again. In contrast, none of the traditional assessment students showed certainty about choosing it again.",
                data: [ { name: 'Trajectory A', 'Same Method': 0, 'Might Change': 66, 'Would Change': 33 }, { name: 'Trajectory B', 'Same Method': 100, 'Might Change': 0, 'Would Change': 0 }, { name: 'Trajectory C', 'Same Method': 50, 'Might Change': 0, 'Would Change': 50 } ], keys: ['Same Method', 'Might Change', 'Would Change'] 
            }
        ];

        const reflectionData = {
            A: {
                id: "OA1",
                label: "Trajectory A",
                title: "Traditional Assessment",
                observation: "General reflections from the traditional assessment showed a preference for the methodology of the second project or maintaining the current format. They indicated general satisfaction with the class.",
                responses: [
                    "I wouldn't change anything because the course development was well explained by the teacher, and he cleared up every doubt the students had.",
                    "That if a project option is given, it should be like the second partial one, choosing the model.",
                    "I think nothing."
                ]
            },
            B: {
                id: "OB1",
                label: "Trajectory B",
                title: "CGS Assessment",
                observation: "General reflections from the CGS method preferred the methodology applied in the second partial and expressed a desire for more time for questions and discussion. They indicated satisfaction with the class.",
                responses: [
                    "I would use the Forum method from the second partial; there was more order regarding doubts or what was wanted in each progress. If used again for both projects, there would be more order and coordination.",
                    "The methodology seemed good to me, and with feedback, it was even better. Perhaps more time could be included for questions or discussion, to reinforce learning while we advance on the project.",
                    "Honestly, I am very satisfied with how we conducted the course.",
                    "I consider it was a very productive class. I managed to learn many things that will be very useful in the future, and the combination we did between STAAD and manual calculations was excellent."
                ]
            },
            C: {
                id: "OC1",
                label: "Trajectory C",
                title: "Mixed Assessment",
                observation: "General reflections from the mixed assessment asked for more time for activities and indicated satisfaction with the class.",
                responses: [
                    "Nothing, everything seemed well explained to me despite it being a very analytical class with plenty of calculations.",
                    "More time to do the first project."
                ]
            }
        };

        const trajectoryData = {
            A: {
                title: "Trajectory A - Traditional",
                icon: <BookOpen className="w-5 h-5 text-white" />,
                description: "Students who opted solely for traditional assessment via exams.",
                pieCharts: [ 
                    { 
                        title: "PA1", 
                        question: "Honestly, what was the determining factor for not attempting the project?", 
                        observation: "Perception of time investment was the main deterrent. Other factors included uncertainty due to lack of 'correct' answers, pressure for performance, and habit.", 
                        data: [ { name: 'Time Factor', value: 66 }, { name: 'Habit/Exam', value: 33 } ] 
                    } 
                ],
                quotes: [
                    { 
                        title: "PA2", 
                        question: "Projects aim to simulate the real life of an engineer. Do you feel that by choosing the exam you lost the opportunity to develop those skills?", 
                        observation: "Students recognized that the project offered better learning opportunities.", 
                        responses: [ "In the end, I felt the project was a better option due to decision making, and if there were another opportunity, I would choose the project.", "Yes, truthfully I felt that my classmates who did the project could work in a way closer to what awaits us in a work environment.", "Maybe yes, but time was a factor." ] 
                    },
                    { 
                        title: "PA3", 
                        question: "Did you feel the exam evaluated your engineering judgment and modeling capacity, or mainly your numerical calculation capacity?", 
                        observation: "Although they perceived similar difficulty, time and feedback made the difference in favor of the project. Some considered the exam was not an effective form of assessment.", 
                        responses: [ "The exam did have the same difficulty level as the project, but the time factor... and the ease of getting a better grade and having feedback was better in the project.", "No.", "Modeling capacity." ] 
                    }
                ]
            },
            B: {
                title: "Trajectory B - CGS Assessment",
                icon: <Layout className="w-5 h-5 text-white" />,
                description: "Students who carried out individual and group projects simulating a consultant role.",
                pieCharts: [ 
                    { 
                        title: "PB1", 
                        question: "Compared to your classmates who studied for exams, how would you describe your workload?", 
                        observation: "100% of students under the CGS methodology perceived a high time investment (more work, more learning), discarding inefficient investment or balanced options.", 
                        data: [ { name: 'High Investment (More hours, more learning)', value: 100 } ] 
                    } 
                ],
                quotes: [
                    { 
                        title: "PB2", 
                        question: "Did you feel you stopped acting like a 'student wanting a grade' and started thinking like an 'Empathetic Problem Solver'?", 
                        observation: "All students felt immersion in their professional roles, extrapolating the techniques used to what they expect to apply in real practice.", 
                        responses: [ "Yes, I felt it mostly in the first project... we even asked other engineers to get their opinion.", "Yes. With the projects, I felt I was no longer thinking just about the grade, but about resolving a real problem.", "Yes, because that is really how we are going to design, with plans and the computer, not like an evaluation.", "Yes, it was necessary to start reviewing in a deeper way to be able to detect if there was any error." ] 
                    },
                    { 
                        title: "PB3", 
                        question: "The project used a role-based methodology. How did this affect your motivation compared to a typical textbook problem?", 
                        observation: "Students expressed greater satisfaction and motivation thanks to the role-based methodology and problems based on reality.", 
                        responses: [ "Regarding motivation, it was better... great satisfaction when there were viable results.", "It motivated me more than a book problem because it felt real... seeing the structure in person made the plans and calculations make sense.", "It's a way of seeing things more applied.", "The fact that the project was based on a structure we can see makes me feel more motivation." ] 
                    }
                ]
            },
            C: {
                title: "Trajectory C - Mixed Assessment",
                icon: <PenTool className="w-5 h-5 text-white" />,
                description: "Students who experienced both assessment methods during the course.",
                pieCharts: [
                    { 
                        title: "PC1", 
                        question: "Which generated more anxiety/stress?", 
                        observation: "There was a mix of anxiety: some students felt more stress with the project and others with the exam.", 
                        data: [ { name: 'The Exam', value: 50 }, { name: 'The Project', value: 50 } ] 
                    },
                    { 
                        title: "PC2", 
                        question: "Which forced you to really understand the behavior of the (physical) structure and not just the mathematics?", 
                        observation: "Everyone agreed that the project improved their physical understanding of the structure much more than the exam.", 
                        data: [ { name: 'The Project', value: 100 } ] 
                    },
                    { 
                        title: "PC3", 
                        question: "Which made you feel prouder of your final result?", 
                        observation: "100% felt prouder of their project result than the exam.", 
                        data: [ { name: 'The Project', value: 100 } ] 
                    }
                ],
                quotes: [
                    { 
                        title: "PC4", 
                        question: "You decided to change methods between the first and second assessment. What motivated that change?", 
                        observation: "The system change was due to high time investment and technical limitations (computer/software) exacerbated by remote teaching.", 
                        responses: [ "In the first one, I took the exam because I saw it was a lot of work... In the second, I did the project because I understood the class better.", "I did the first project but didn't do the second, mainly because of my computer." ] 
                    }
                ]
            }
        };

        // --- UI COMPONENTS ---

        const NavButton = ({ active, onClick, icon: Icon, label }) => (
            <button 
                onClick={onClick}
                className={`
                    relative px-6 py-4 font-semibold text-sm tracking-wide uppercase transition-all duration-300
                    flex items-center gap-2 border-b-4
                    ${active 
                        ? 'border-unitec-cyan text-unitec-blue bg-white' 
                        : 'border-transparent text-slate-400 hover:text-unitec-blue hover:bg-slate-100'
                    }
                `}
            >
                {Icon && <Icon className={`w-4 h-4 ${active ? 'text-unitec-cyan' : 'text-slate-400'}`} />}
                {label}
            </button>
        );

        const SectionTitle = ({ title, subtitle }) => (
            <div className="mb-8 border-l-4 border-unitec-cyan pl-4">
                <h2 className="text-2xl md:text-3xl font-extrabold text-unitec-blue">{title}</h2>
                {subtitle && <p className="text-slate-500 mt-1 font-medium">{subtitle}</p>}
            </div>
        );

        const Card = ({ children, className = "" }) => (
            <div className={`bg-white shadow-card border border-slate-200 rounded-sm overflow-hidden ${className}`}>
                {/* Top "Diamond" Accent */}
                <div className="h-1 w-full bg-gradient-to-r from-unitec-blue via-unitec-cyan to-unitec-vividSky"></div>
                <div className="p-6">
                    {children}
                </div>
            </div>
        );

        const ObservationBox = ({ text }) => (
            <div className="mt-4 p-4 bg-slate-50 border-l-4 border-unitec-federalBlue flex gap-4 items-start">
                <div>
                    <h5 className="font-bold text-unitec-blue text-xs uppercase tracking-wider mb-1">Key Finding</h5>
                    <p className="text-slate-700 text-sm italic">{text}</p>
                </div>
            </div>
        );

        // --- MAIN APP ---

        const App = () => {
            const [activeTab, setActiveTab] = useState('summary');
            const [selectedQuestion, setSelectedQuestion] = useState(comparativeData[0].id);

            const renderContent = () => {
                if (activeTab === 'summary') {
                    return (
                        <div className="fade-in max-w-5xl mx-auto">
                            <SectionTitle title="Executive Summary" subtitle="Degrees of Freedom in Assessment: CGS System in Civil Engineering" />
                            
                            <Card className="mb-8">
                                <div className="border-b border-slate-100 pb-4 mb-6">
                                    <h1 className="text-2xl md:text-3xl font-extrabold text-unitec-blue mb-2 leading-tight">
                                        Degrees of Freedom in Assessment: Fostering Deep Learning and Professional Ethics through the CGS System in Civil Engineering
                                    </h1>
                                    <div className="flex flex-col md:flex-row gap-4 mt-4 text-sm text-slate-500 font-medium">
                                        <div className="flex items-center gap-2">
                                            <span className="bg-unitec-cyan/10 text-unitec-cyan px-2 py-1 rounded">Author</span>
                                            Marco Tulio Canales Chavez, PhD
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <span className="bg-unitec-blue/10 text-unitec-blue px-2 py-1 rounded">Institution</span>
                                            Universidad Tecnológica Centroamericana
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="space-y-6 text-slate-700 leading-relaxed text-justify">
                                    <p>
                                        Between October and December 2025, an active assessment methodology based on Kevin Bartlett's Collective Growth System (CGS) was implemented in a third-year Civil Engineering course at Unitec, Tegucigalpa, Honduras. The study was designed by granting 12 students the freedom to choose their assessment modality, resulting in three distinct groups: 4 students opted exclusively for the traditional exam methodology (Trajectory A), 4 chose the CGS methodology via projects with defined roles, scenarios, and goals (Trajectory B), and 4 combined both methods (Trajectory C).
                                    </p>
                                    <p>
                                        The analysis results showed that students developed a marked preference for the CGS methodology, reporting a high perception of learning compared to the traditional method. Data indicates that Trajectory B students achieved 100% satisfaction in critical areas such as deep understanding, ethical responsibility, and practical application. A fundamental finding was the perception of the cost-benefit ratio: participants recognized that CGS requires a high time investment, but that this yields a high return of significant professional learning. In contrast, resistance to adopting the methodology in the other trajectories was not due to the model's inefficacy, but was directly linked to available time and academic load management as the main barrier.
                                    </p>
                                </div>
                            </Card>
                        </div>
                    );
                }

                if (activeTab === 'comparative') {
                    const currentQData = comparativeData.find(d => d.id === selectedQuestion);
                    return (
                        <div className="fade-in max-w-5xl mx-auto">
                            <SectionTitle title="Comparative Analysis (L Questions)" subtitle="Comparison of perceptions among the three learning trajectories." />
                            
                            <div className="grid grid-cols-1 md:grid-cols-12 gap-6">
                                {/* Control Panel */}
                                <div className="md:col-span-4 space-y-2">
                                    <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Select Indicator</label>
                                    <div className="flex flex-col gap-2">
                                        {comparativeData.map(q => (
                                            <button 
                                                key={q.id}

                                                className={`

                                                        : 'border-transparent text-slate-500 hover:bg-slate-100 hover:text-slate-700'
                                                    }
                                                `}
                                            >
                                                <span className="font-bold mr-2 opacity-50">{q.id}</span>
                                                {q.question}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Visualization */}
                                <Card className="md:col-span-8">
                                    <div className="mb-6">
                                        <h3 className="text-lg font-bold text-unitec-blue mb-2 leading-tight">{currentQData.fullQuestion}</h3>
                                        <div className="w-12 h-1 bg-unitec-cyan mb-4"></div>
                                    </div>

                                    <div className="h-[350px] w-full">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <BarChart data={currentQData.data} layout="vertical" margin={{ top: 5, right: 30, left: 20, bottom: 5 }}>
                                                <CartesianGrid strokeDasharray="3 3" horizontal={true} vertical={false} stroke="#E2E8F0" />
                                                <XAxis type="number" domain={[0, 100]} hide />
                                                <YAxis type="category" dataKey="name" width={100} tick={{fill: '#475569', fontSize: 12, fontWeight: 600}} axisLine={false} tickLine={false} />
                                                <Tooltip 
                                                    cursor={{fill: '#F1F5F9'}}
                                                    contentStyle={{ border: 'none', boxShadow: '0 4px 6px -1px rgba(0, 0, 0, 0.1)', borderRadius: '0px' }}
                                                />
                                                <Legend iconType="square" />
                                                {currentQData.keys.map((key, index) => {
                                                    // Unitec Color Logic
                                                    let fillColor = UNITEC_COLORS.neutral;
                                                    if (key.includes("Strongly Agree") || key.includes("Same Method") || key.includes("High")) fillColor = UNITEC_COLORS.federalBlue;
                                                    else if (key.includes("Agree") || key.includes("Similar")) fillColor = UNITEC_COLORS.pacificCyan;
                                                    else if (key.includes("Change") || key.includes("Neutral")) fillColor = UNITEC_COLORS.vividSky;
                                                    
                                                    // Override for L7 (Effort - semantic)
                                                    if (key.includes("More Effort")) fillColor = UNITEC_COLORS.federalBlue; 
                                                    if (key.includes("Less Effort")) fillColor = '#EF4444'; // Red alert

                                                    return <Bar key={key} dataKey={key} stackId="a" fill={fillColor} barSize={30} radius={[0, 4, 4, 0]} />
                                                })}
                                            </BarChart>
                                        </ResponsiveContainer>
                                    </div>
                                    
                                    {currentQData.observation && <ObservationBox text={currentQData.observation} />}
                                </Card>
                            </div>
                        </div>
                    );
                }

                if (activeTab === 'reflection') {
                    return (
                        <div className="fade-in max-w-6xl mx-auto">
                            <SectionTitle title="Reflections on Methodology" subtitle="What would you change about the course methodology to improve future learning?" />
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                {Object.values(reflectionData).map((item, idx) => {
                                    const borderColors = {
                                        A: 'border-t-unitec-blue',
                                        B: 'border-t-unitec-cyan',
                                        C: 'border-t-slate-400'
                                    };
                                    return (
                                        <Card key={item.id} className={`flex flex-col h-full border-t-4 ${borderColors[item.id.charAt(1)] || 'border-t-gray-400'}`}>
                                            <div className="mb-4">
                                                <span className="text-xs font-bold text-slate-400 uppercase">{item.label}</span>
                                                <h3 className="text-xl font-extrabold text-unitec-blue mt-1">{item.title}</h3>
                                            </div>
                                            
                                            <div className="flex-grow space-y-4 mb-6">
                                                {item.responses.map((resp, i) => (
                                                    <div key={i} className="relative pl-6">
                                                        <span className="absolute left-0 top-0 text-3xl text-unitec-cyan font-serif leading-3 opacity-30">“</span>
                                                        <p className="text-sm text-slate-600 italic leading-relaxed">{resp}</p>
                                                    </div>
                                                ))}
                                            </div>

                                            <div className="pt-4 border-t border-slate-100 mt-auto">
                                                <p className="text-xs text-unitec-blue font-bold uppercase mb-1">
                                                    Observation:
                                                </p>
                                                <p className="text-xs text-slate-500">{item.observation}</p>
                                            </div>
                                        </Card>
                                    );
                                })}
                            </div>
                        </div>
                    );
                }

                // Individual Trajectories
                const data = trajectoryData[activeTab];
                const headerColors = {
                    A: 'bg-unitec-blue',
                    B: 'bg-unitec-cyan',
                    C: 'bg-slate-600'
                };

                return (
                    <div className="slide-up max-w-6xl mx-auto">
                        <div className={`p-8 rounded-sm text-white mb-8 shadow-md flex items-center gap-6 ${headerColors[activeTab] || 'bg-slate-700'}`}>
                            <div className="p-4 bg-white/10 rounded-full backdrop-blur-sm">
                                {data.icon}
                            </div>
                            <div>
                                <h2 className="text-3xl font-extrabold">{data.title}</h2>
                                <p className="text-white/80 font-medium text-lg mt-1">{data.description}</p>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            <div className="space-y-6">
                                {data.pieCharts.map((chart, idx) => (
                                    <Card key={idx}>
                                        <div className="flex items-center gap-2 mb-2">
                                            {/* ICON ELIMINATED TO REDUCE VISUAL NOISE */}
                                            <h3 className="font-bold text-slate-800">{chart.title}</h3>
                                        </div>
                                        <p className="text-xs text-slate-500 mb-4 uppercase tracking-wide">{chart.question}</p>
                                        
                                        <div className="h-[200px] w-full flex items-center justify-center">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <PieChart>
                                                    <Pie 
                                                        data={chart.data} 
                                                        innerRadius={50} 
                                                        outerRadius={70} 
                                                        paddingAngle={5} 
                                                        dataKey="value"
                                                    >
                                                        {chart.data.map((entry, index) => (
                                                            <Cell key={`cell-${index}`} fill={PIE_COLORS[index % PIE_COLORS.length]} stroke="none" />
                                                        ))}
                                                    </Pie>
                                                    <Tooltip contentStyle={{ borderRadius: '4px', border: 'none', boxShadow: '0 2px 5px rgba(0,0,0,0.1)' }} />
                                                    <Legend verticalAlign="middle" align="right" layout="vertical" iconType="circle" />
                                                </PieChart>
                                            </ResponsiveContainer>
                                        </div>
                                        {chart.observation && <p className="mt-4 text-sm text-center text-unitec-blue font-medium bg-blue-50 py-2 px-3 rounded-sm">{chart.observation}</p>}
                                    </Card>
                                ))}
                            </div>
                            
                            <div className="space-y-6">
                                {data.quotes.map((q, idx) => (
                                    <Card key={idx} className="border-l-4 border-l-unitec-vividSky">
                                        <h3 className="font-bold text-slate-800 text-lg">{q.title}</h3>
                                        <p className="text-sm text-slate-500 mb-4">{q.question}</p>
                                        <div className="space-y-3">
                                            {q.responses.map((resp, i) => (
                                                <div key={i} className="flex gap-3">
                                                    <div className="min-w-[4px] bg-slate-200 rounded-full"></div>
                                                    <p className="text-slate-600 text-sm italic">"{resp}"</p>
                                                </div>
                                            ))}
                                        </div>
                                        {q.observation && (
                                            <div className="mt-4 pt-4 border-t border-slate-100">
                                                <p className="text-xs text-unitec-blue font-bold uppercase mb-1">
                                                    Observation:
                                                </p>
                                                <p className="text-xs text-slate-500">{q.observation}</p>
                                            </div>
                                        )}
                                    </Card>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen pb-12">
                    {/* Institutional Header */}
                    <header className="bg-unitec-blue text-white shadow-lg sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 md:px-8 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-4">
                                <UnitecLogo />
                                <div className="hidden md:block h-8 w-px bg-white/20"></div>
                                <h1 className="hidden md:block text-sm font-semibold tracking-wider text-unitec-sky uppercase">Faculty of Engineering</h1>
                            </div>
                            <div className="text-right">
                                <p className="text-xs text-slate-300 font-medium uppercase tracking-widest">2025 Study</p>
                                <p className="text-sm font-bold">CIV324 Structural Analysis</p>
                            </div>
                        </div>
                    </header>

                    {/* Main Navigation */}
                    <div className="bg-white shadow-sm border-b border-slate-200 mb-8 sticky top-20 z-40">
                        <div className="max-w-7xl mx-auto px-4 md:px-8 flex overflow-x-auto">
                            <NavButton active={activeTab === 'summary'} onClick={() => setActiveTab('summary')} icon={FileText} label="Summary" />
                            <NavButton active={activeTab === 'comparative'} onClick={() => setActiveTab('comparative')} icon={BarChart2} label="Comparative" />
                            <NavButton active={activeTab === 'A'} onClick={() => setActiveTab('A')} label="Trajectory A" />
                            <NavButton active={activeTab === 'B'} onClick={() => setActiveTab('B')} label="Trajectory B" />
                            <NavButton active={activeTab === 'C'} onClick={() => setActiveTab('C')} label="Trajectory C" />
                            <NavButton active={activeTab === 'reflection'} onClick={() => setActiveTab('reflection')} icon={Lightbulb} label="Reflections" />
                        </div>
                    </div>

                    <main className="px-4 md:px-8">
                        {renderContent()}
                    </main>

                    <footer className="max-w-7xl mx-auto px-8 mt-12 pt-8 border-t border-slate-200 text-center text-slate-400 text-xs">
                        <p className="font-semibold text-slate-600 mb-2">Author: Marco Tulio Canales Chavez, PhD</p>
                        <p>© 2025 Universidad Tecnológica Centroamericana. All rights reserved.</p>
                        <p className="mt-2">Exclusive use for academic purposes.</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
