        // Lógica heurística para determinar el Criterio ACAAI relacionado
        function determinarCriterioACAAI(proyecto) {
            // Unir varios campos para analizar el contexto
            const textoContexto = [
                proyecto['Nombre Breve'], 
                proyecto['Impacto'], 
                proyecto['Actividades Acordadas'],
                proyecto['Objetivo']
            ].join(' ').toLowerCase();

            if (textoContexto.includes('acreditacion') || textoContexto.includes('acaai') || textoContexto.includes('autoestudio')) {
                return 'Criterio 10: Mejora Continua y Acreditación';
            }
            if (textoContexto.includes('curricular') || textoContexto.includes('estudio') || textoContexto.includes('clase')) {
                return 'Criterio 3: Plan de Estudios';
            }
            if (textoContexto.includes('docente') || textoContexto.includes('capacitacion') || textoContexto.includes('taller')) {
                return 'Criterio 1: Personal Docente';
            }
            if (textoContexto.includes('estudiant') || textoContexto.includes('prospeccion') || textoContexto.includes('admision')) {
                return 'Criterio 2: Estudiantes';
            }
            if (textoContexto.includes('institucional') || textoContexto.includes('dga') || textoContexto.includes('colaboracion')) {
                return 'Criterio 8: Apoyo Institucional';
            }
            
            // Por defecto, todo cae bajo seguimiento sistemático de mejora
            return 'Criterio 10: Plan de Mejora Continua';
        }

        // Función para limpiar y normalizar el período
        function normalizarPeriodo(periodoStr) {
            if (!periodoStr) return "N/D";
            // Convierte cosas como Q2=Q4 o Q1 Y Q4 a un formato estandar
            return periodoStr.replace(/=/g, '-').replace(/y/gi, '&').toUpperCase().trim();
        }

                            <!-- Indicador & Métrica -->
                            <div class="grid grid-cols-2 gap-3">
                                <div class="bg-blue-50/50 p-3 rounded border border-blue-100 flex flex-col">
                                    <span class="font-semibold text-blue-900 block text-xs uppercase mb-1">Indicador</span>
                                    <span class="text-gray-700 text-sm flex-grow">${p['Indicador'] || '-'}</span>
                                </div>
                                <div class="bg-blue-50/50 p-3 rounded border border-blue-100 flex flex-col">
                                    <span class="font-semibold text-blue-900 block text-xs uppercase mb-1">Métrica</span>
                                    <span class="text-gray-700 text-sm flex-grow">${p['Metrica'] || '-'}</span>
                                </div>
                            </div>

                            <!-- Resultados Esperados -->
                            <div class="bg-green-50 p-3 rounded border border-green-200">
                                <span class="font-bold text-green-800 block mb-1 flex items-center">
                                    <i class="fas fa-flag-checkered mr-2"></i> Resultados Esperados
                                </span>
                                <p class="text-gray-700 italic">${p['Resultados Esperados'] || '-'}</p>
                            </div>
                            
                            <!-- Criterio ACAAI (Calculado) -->
                            <div class="mt-auto pt-2">
                                <span class="font-semibold text-gray-500 block text-xs uppercase mb-1">Criterio ACAAI Relacionado</span>
                                <span class="inline-block bg-[#002f6c] text-white text-xs px-2 py-1 rounded shadow-sm">
                                    <i class="fas fa-clipboard-check mr-1 text-blue-300"></i> ${criterioACAAI}
                                </span>
                            </div>
                        </div>
                        
                        <!-- Footer: Período -->
                        <div class="bg-gray-100 p-3 border-t border-gray-200 flex justify-between items-center">
                            <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">Período de Ejecución</span>
                            <span class="bg-white text-red-600 font-bold px-3 py-1 rounded shadow-sm border border-red-100 text-sm flex items-center">
                                <i class="far fa-calendar-alt mr-2"></i> ${periodo}
                            </span>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        // Inicializar con los datos cargados de manera automática al abrir la página
        window.onload = () => {
            renderCards(proyectosData);
        };
    </script>
</body>
</html>
