        function normalizeStr(str) {
            if (!str) return "";
            return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
        }

        function renderFilters() {
            const container = document.getElementById('filters-grid');
            container.innerHTML = '';

            jerarquiaEjes.forEach(eje => {
                let ejeHtml = `<div class="flex flex-col gap-3">`;

                ejeHtml += `<button onclick="filtrarProyectos('eje', '${eje.nombre}')" class="w-full text-left font-bold bg-unitec-federal text-white p-4 border-2 border-transparent hover:border-unitec-cyan transition-colors duration-300 text-sm flex justify-between items-center group">
                                <span>${eje.nombre}</span>
                                <div class="w-2 h-2 bg-white transform rotate-45 group-hover:bg-unitec-cyan transition-colors"></div>
                            </button>`;

                eje.impactos.forEach(impacto => {
                    const hasProjects = proyectosData.some(p => normalizeStr(p.Impacto) === normalizeStr(impacto));
                    
                    if (hasProjects) {
                        ejeHtml += `<button onclick="filtrarProyectos('impacto', '${impacto}')" class="w-full text-left text-xs p-3 border-2 border-gray-200 text-unitec-federal bg-white hover:border-unitec-cyan transition-colors font-medium flex items-center">

                                    </button>`;

                                        <span class="text-[10px] text-gray-400 block mt-2 ml-4 italic">(Planificado post-2026)</span>
                                    </button>`;
                    }
                });

                ejeHtml += `</div>`;
                container.insertAdjacentHTML('beforeend', ejeHtml);
            });
        }

        function filtrarProyectos(tipo, valor) {
            let filtrados = [];
            if (tipo === 'todos') {
                filtrados = proyectosData;
            } else if (tipo === 'eje') {
                const valorNorm = normalizeStr(valor).replace(/^[0-9]\.\s*/, '');

            } else if (tipo === 'impacto') {
                filtrados = proyectosData.filter(p => normalizeStr(p.Impacto) === normalizeStr(valor));
            }
            renderCards(filtrados);
        }

            const container = document.getElementById('cards-container');
            container.innerHTML = `
                <div class="col-span-full bg-white border-2 border-unitec-federal p-8 mt-4 relative">
                    <div class="absolute -top-3 -right-3 w-6 h-6 bg-unitec-federal transform rotate-45 border-2 border-white"></div>
                    <div class="flex flex-col md:flex-row items-start">
                        <div class="md:ml-6 flex-grow">
                            <span class="text-xs font-bold text-unitec-cyan uppercase tracking-widest block mb-1">Visión de Futuro</span>
                            <h3 class="text-3xl font-black text-unitec-federal mb-4 uppercase tracking-tight">Estrategia Multi-año</h3>
                            <h4 class="text-lg font-bold text-gray-800 mb-4 border-l-4 border-unitec-cyan pl-3">${impactoNombre}</h4>
                            <p class="text-gray-600 leading-relaxed text-sm md:text-base mb-6 font-medium">
                                Esta distribución de objetivos forma parte de una estrategia multi-año a nivel institucional. 
                                En el <strong>2026 no se tienen proyectos mapeados</strong> a este impacto específico en la Facultad de Ingeniería de UNITEC, 
                                pero esto evolucionará en base a nuestro crecimiento institucional planificado para el 2027 en adelante.
                            </p>
                            <button onclick="filtrarProyectos('todos', '')" class="bg-unitec-federal text-white hover:bg-unitec-cyan font-bold py-3 px-6 transition-colors text-sm uppercase tracking-wider">
                                Volver al Portafolio Actual
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function determinarCriterioACAAI(proyecto) {
            const textoContexto = [proyecto['Nombre Breve'], proyecto['Impacto'], proyecto['Actividades Acordadas'], proyecto['Objetivo']].join(' ').toLowerCase();
            if (textoContexto.includes('acreditacion') || textoContexto.includes('acaai') || textoContexto.includes('autoestudio')) return 'Criterio 10: Mejora Continua y Acreditación';
            if (textoContexto.includes('curricular') || textoContexto.includes('estudio') || textoContexto.includes('clase')) return 'Criterio 3: Plan de Estudios';
            if (textoContexto.includes('docente') || textoContexto.includes('capacitacion') || textoContexto.includes('taller')) return 'Criterio 1: Personal Docente';
            if (textoContexto.includes('estudiant') || textoContexto.includes('prospeccion') || textoContexto.includes('admision')) return 'Criterio 2: Estudiantes';
            if (textoContexto.includes('institucional') || textoContexto.includes('dga') || textoContexto.includes('colaboracion')) return 'Criterio 8: Apoyo Institucional';
            return 'Criterio 10: Plan de Mejora Continua';
        }

        function normalizarPeriodo(periodoStr) {
            if (!periodoStr) return "N/D";
            return periodoStr.replace(/=/g, '-').replace(/y/gi, '&').toUpperCase().trim();
        }

        function renderCards(proyectos) {
            const container = document.getElementById('cards-container');
            container.innerHTML = ''; 

            if (proyectos.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-12 text-unitec-federal font-bold text-lg">No se encontraron datos de proyectos para este criterio.</div>';
                return;
            }

            proyectos.forEach(p => {
                if (!p['Codigo'] && !p['Nombre Breve']) return;

                const criterioACAAI = determinarCriterioACAAI(p);
                const periodo = normalizarPeriodo(p['Período']);

                // Diseño plano, sin bordes redondeados exagerados, con colores de marca exactos
                const cardHTML = `
                    <div class="bg-white border-2 border-unitec-federal flex flex-col h-full print-break-inside-avoid hover:border-unitec-cyan transition-colors duration-300 card-impresion group">
                        
                        <!-- Header de la Ficha -->
                        <div class="bg-unitec-federal text-white p-5 group-hover:bg-[#080875] transition-colors">
                            <div class="flex justify-between items-start gap-4">
                                <h3 class="font-black text-xl leading-tight flex-1 uppercase tracking-tight">${p['Nombre Breve'] || 'Proyecto Sin Nombre'}</h3>
                                <span class="bg-unitec-cyan text-white text-xs font-bold px-3 py-1 whitespace-nowrap tracking-widest border border-unitec-cyan">
                                    ${p['Codigo'] || '-'}
                                </span>
                            </div>
                        </div>
                        
                        <!-- Cuerpo de la Ficha -->
                        <div class="p-6 flex-grow flex flex-col gap-6 text-sm">
                            
                            <!-- Eje e Impacto -->
                            <div class="border-l-4 border-unitec-federal pl-4">
                                <div class="mb-3">
                                    <span class="font-black text-unitec-federal block text-[10px] uppercase tracking-widest mb-1">Eje Institucional</span>
                                    <span class="text-gray-800 font-semibold">${p['Eje'] || 'No especificado'}</span>
                                </div>
                                <div>
                                    <span class="font-black text-unitec-federal block text-[10px] uppercase tracking-widest mb-1">Impacto Asociado</span>
                                    <span class="text-gray-800 font-medium flex items-center">
                                        <div class="w-1.5 h-1.5 bg-unitec-cyan transform rotate-45 mr-2"></div>
                                        ${p['Impacto'] || 'No especificado'}
                                    </span>
                                </div>
                            </div>
                            
                            <!-- Actividades -->
                            <div>
                                <span class="font-black text-white bg-unitec-federal px-2 py-1 text-[10px] uppercase tracking-widest inline-block mb-3">Actividades Acordadas</span>
                                <p class="text-gray-700 leading-relaxed font-medium">${p['Actividades Acordadas'] || 'Ninguna actividad descrita.'}</p>
                            </div>
                            
                            <!-- Indicador & Métrica -->
                            <div class="grid grid-cols-2 gap-4">
                                <div class="bg-gray-50 p-4 border border-gray-200 flex flex-col">
                                    <span class="font-bold text-unitec-cyan block text-[10px] uppercase tracking-widest mb-2">Indicador</span>
                                    <span class="text-gray-800 font-medium text-xs flex-grow">${p['Indicador'] || '-'}</span>
                                </div>
                                <div class="bg-gray-50 p-4 border border-gray-200 flex flex-col">
                                    <span class="font-bold text-unitec-cyan block text-[10px] uppercase tracking-widest mb-2">Métrica</span>
                                    <span class="text-gray-800 font-medium text-xs flex-grow">${p['Metrica'] || '-'}</span>
                                </div>
                            </div>

                            <!-- Resultados Esperados -->
                            <div class="border-t-2 border-gray-100 pt-4 mt-2">
                                <span class="font-black text-unitec-federal block text-xs uppercase tracking-widest mb-2 flex items-center">
                                    Resultados Esperados
                                </span>
                                <p class="text-gray-600 font-medium italic">${p['Resultados Esperados'] || '-'}</p>
                            </div>
                            
                            <!-- Criterio ACAAI -->
                            <div class="mt-auto pt-4">
                                <span class="font-bold text-gray-400 block text-[10px] uppercase tracking-widest mb-2">Criterio ACAAI Relacionado</span>
                                <span class="inline-block border border-unitec-federal text-unitec-federal font-bold text-xs px-3 py-1">
                                    ${criterioACAAI}
                                </span>
                            </div>
                        </div>
                        
                        <!-- Footer: Período -->
                        <div class="bg-white p-4 border-t-2 border-unitec-federal flex justify-between items-center group-hover:bg-gray-50 transition-colors">
                            <span class="text-[10px] font-black text-unitec-federal uppercase tracking-widest">Ejecución</span>
                            <span class="text-unitec-federal font-black text-sm flex items-center tracking-wider">
                                <div class="w-2 h-2 border border-unitec-federal transform rotate-45 mr-2"></div>
                                ${periodo}
                            </span>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        window.onload = () => {
            renderFilters();
            renderCards(proyectosData);
        };
    </script>
</body>
</html>
