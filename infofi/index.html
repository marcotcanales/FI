<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facultad de Ingeniería | UNITEC</title>
    
    <!-- Google Fonts: Poppins (Manual de Marca) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Configuración de Colores Institucionales -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'poppins': ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        'federal-blue': '#06065C', // Color primario
                        'pacific-cyan': '#03AED2', // Color secundario/acento
                        'vivid-sky': '#47C8FD',
                        'cobalt-pink': '#CF4986', // Acento complementario
                        'light-gray': '#F4F4F4'
                    }
                }
            }
        }
    </script>

    <style>
        /* Estilos personalizados para la barra de desplazamiento */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #06065C; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #03AED2; 
        }
        
        .nav-item.active {
            background-color: rgba(3, 174, 210, 0.15);
            border-right: 4px solid #03AED2;
            color: #03AED2;
        }
        
        /* Asegurar scroll suave en iOS para iframes */
        .iframe-container {
            -webkit-overflow-scrolling: touch;
        }

        /* Animación para el botón flotante */
        .fab-animation {
            animation: bounce-in 0.5s ease-out;
        }
        
        @keyframes bounce-in {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="font-poppins bg-gray-100 h-screen w-screen flex flex-col md:flex-row overflow-hidden">

    <!-- Overlay para móvil (Backdrop) -->
    <div id="mobile-overlay" onclick="closeSidebar()" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden md:hidden transition-opacity duration-300"></div>

    <!-- Header Móvil (Visible solo en < md) -->
    <header class="md:hidden h-16 bg-federal-blue flex items-center justify-between px-4 shadow-md z-20 flex-shrink-0">
        <div class="flex items-center gap-2">
            <div class="w-6 h-6 bg-pacific-cyan rotate-45 flex items-center justify-center shadow-sm">
                <div class="w-3 h-3 bg-white"></div>
            </div>
            <span class="text-white font-bold text-lg tracking-wide">Ingeniería</span>
        </div>
        <button onclick="toggleSidebar()" class="text-white focus:outline-none p-2 rounded hover:bg-white/10 transition" aria-label="Abrir menú">
            <i class="fa-solid fa-bars text-xl"></i>
        </button>
    </header>

    <!-- Sidebar de Navegación -->
    <!-- Clases clave: fixed en móvil, relative en md. Translate para ocultar/mostrar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-72 bg-white shadow-2xl flex flex-col h-full transform -translate-x-full transition-transform duration-300 ease-in-out md:relative md:translate-x-0 md:w-80">
        
        <!-- Header del Sidebar (Desktop) -->
        <div class="p-6 bg-federal-blue text-white shadow-md z-10 hidden md:block">
            <div class="flex items-center gap-3 mb-2">
                <div class="w-8 h-8 bg-pacific-cyan rotate-45 flex items-center justify-center shadow-lg">
                    <div class="w-4 h-4 bg-white"></div>
                </div>
                <h1 class="text-2xl font-bold tracking-wide">UNITEC</h1>
            </div>
            <p class="text-sm font-light text-gray-300 uppercase tracking-widest mt-2 border-t border-gray-600 pt-2">Facultad de Ingeniería</p>
        </div>

        <!-- Header Sidebar Móvil (Con botón cerrar claro) -->
        <div class="md:hidden p-4 bg-federal-blue text-white flex justify-between items-center shadow-md">
            <span class="font-bold flex items-center gap-2"><i class="fa-solid fa-list-ul"></i> Lista de Carreras</span>
            <button onclick="closeSidebar()" class="text-white p-2 hover:bg-white/20 rounded-full transition"><i class="fa-solid fa-times text-lg"></i></button>
        </div>

        <!-- Lista de Programas (Scrollable) -->
        <div class="flex-1 overflow-y-auto py-2">
            
            <!-- Botón Inicio / Reset -->
            <button onclick="resetView()" class="nav-item w-full flex items-center px-6 py-4 text-gray-700 hover:bg-gray-50 transition-colors duration-200 border-r-4 border-transparent text-left group border-b border-gray-100">
                <div class="min-w-[24px] text-center mr-3">
                    <i class="fa-solid fa-home text-lg text-federal-blue group-hover:text-pacific-cyan transition-colors"></i>
                </div>
                <div>
                    <span class="block text-sm font-bold text-federal-blue">Inicio</span>
                </div>
            </button>

            <p class="px-6 py-3 text-xs font-bold text-gray-400 uppercase tracking-wider">Programas de Pregrado</p>
            
            <nav class="space-y-1" id="menu-list">
                <!-- Los elementos se generan con JS -->
            </nav>

            <div class="mt-4 mb-2 px-6">
                <div class="h-px bg-gray-200"></div>
            </div>

            <!-- Botón FabLab (Link Externo) -->
            <a href="https://fablab.unitec.edu/" target="_blank" rel="noopener noreferrer" 
               class="nav-item w-full flex items-center px-6 py-3 text-gray-700 hover:bg-gray-50 transition-colors duration-200 group text-left">
                <div class="w-8 h-8 rounded-full bg-federal-blue text-white flex items-center justify-center mr-3 shadow-md group-hover:bg-pacific-cyan transition-colors flex-shrink-0">
                    <i class="fa-solid fa-cube text-sm"></i>
                </div>
                <div>
                    <span class="block font-bold text-sm text-federal-blue">FabLab UNITEC</span>
                    <span class="text-xs text-gray-500">Innovación <i class="fa-solid fa-arrow-up-right-from-square text-[10px] ml-1"></i></span>
                </div>
            </a>
        </div>

        <!-- Footer del Sidebar -->
        <div class="p-3 bg-gray-50 border-t border-gray-200 text-center text-xs">
            <p class="text-gray-500 font-medium">Sedes: Tegucigalpa & SPS</p>
            <p class="text-[10px] text-gray-400 mt-1">© 2026 Facultad de Ingeniería</p>
        </div>
    </aside>

    <!-- Área Principal de Contenido -->
    <main class="flex-1 flex flex-col h-full relative bg-white w-full">
        
        <!-- Botón Flotante para Móvil (Solo visible en pantallas pequeñas) -->
        <!-- Este botón es crucial para resolver el problema del usuario -->
        <button onclick="toggleSidebar()" 
                class="md:hidden fixed bottom-6 right-6 z-50 bg-pacific-cyan text-white w-14 h-14 rounded-full shadow-xl flex items-center justify-center hover:bg-federal-blue transition-colors duration-300 fab-animation active:scale-95 border-2 border-white"
                aria-label="Abrir Menú de Carreras">
            <i class="fa-solid fa-bars text-xl"></i>
        </button>

        <!-- Contenedor del Iframe -->
        <div class="flex-1 relative w-full h-full iframe-container">
            
            <!-- Estado de Carga / Bienvenida -->
            <div id="welcome-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-white z-10 text-center p-6 overflow-y-auto">
                <div class="w-20 h-20 bg-federal-blue rotate-45 flex items-center justify-center shadow-2xl mb-8 animate-pulse">
                    <div class="w-10 h-10 bg-pacific-cyan"></div>
                </div>
                <h2 class="text-2xl md:text-3xl font-bold text-federal-blue mb-2">Facultad de Ingeniería</h2>
                <h3 class="text-lg text-pacific-cyan font-medium mb-4">Selección de Programas</h3>
                <p class="text-sm md:text-base text-gray-500 max-w-md mx-auto mb-8">
                    Explora nuestra oferta académica seleccionando una carrera del menú.
                </p>
                
                <div class="md:hidden">
                    <button onclick="openSidebar()" class="px-6 py-3 bg-federal-blue text-white rounded-lg shadow-lg font-medium text-sm hover:bg-opacity-90 transition">
                        <i class="fa-solid fa-list mr-2"></i> Ver Carreras
                    </button>
                </div>
            </div>

            <!-- Iframe para cargar contenido externo -->
            <iframe id="content-frame" name="content-frame" class="w-full h-full border-0 absolute inset-0 z-0 hidden bg-white" src="" allowfullscreen></iframe>
            
        </div>
    </main>

    <!-- JavaScript Lógica -->
    <script>
        // Datos de las carreras
        const programs = [
            { code: 'I-01', name: 'Ingeniería en Sistemas Computacionales', icon: 'fa-laptop-code', url: 'https://capexfi25-30.netlify.app/infofi/sistemas.html' },
            { code: 'I-02', name: 'Ingeniería Industrial y de Sistemas', icon: 'fa-industry', url: 'https://capexfi25-30.netlify.app/infofi/industrial.html' },
            { code: 'I-03', name: 'Ingeniería Civil', icon: 'fa-hard-hat', url: 'https://capexfi25-30.netlify.app/infofi/civil.html' },
            { code: 'I-04', name: 'Ing. en Telecomunicaciones y Redes', icon: 'fa-tower-cell', url: 'https://capexfi25-30.netlify.app/infofi/telecomunicaciones.html' },
            { code: 'I-05', name: 'Ingeniería en Mecatrónica', icon: 'fa-robot', url: 'https://capexfi25-30.netlify.app/infofi/mecatronica.html' },
            { code: 'I-10', name: 'Ingeniería Biomédica', icon: 'fa-heart-pulse', url: 'https://capexfi25-30.netlify.app/infofi/biomedica.html' },
            { code: 'I-12', name: 'Ingeniería en Energía', icon: 'fa-bolt', url: 'https://capexfi25-30.netlify.app/infofi/energia.html' },
            { code: 'I-14', name: 'Ing. en Ciencia de Datos e IA', icon: 'fa-brain', url: 'https://capexfi25-30.netlify.app/infofi/cdia.html' }
        ];

        const menuList = document.getElementById('menu-list');
        const iframe = document.getElementById('content-frame');
        const welcomeScreen = document.getElementById('welcome-screen');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('mobile-overlay');

        // Generar Menú
        programs.forEach(prog => {
            const btn = document.createElement('button');
            btn.className = 'nav-item w-full flex items-center px-6 py-3 text-gray-600 hover:bg-gray-50 hover:text-federal-blue transition-all duration-200 border-r-4 border-transparent text-left group';
            btn.onclick = () => loadPage(prog.url, btn);
            
            btn.innerHTML = `
                <div class="min-w-[24px] text-center mr-3">
                    <i class="fa-solid ${prog.icon} text-lg text-gray-400 group-hover:text-pacific-cyan transition-colors"></i>
                </div>
                <div>
                    <span class="block text-[10px] font-bold text-pacific-cyan uppercase tracking-wider mb-0.5">${prog.code}</span>
                    <span class="block text-xs md:text-sm font-medium leading-tight">${prog.name}</span>
                </div>
            `;
            menuList.appendChild(btn);
        });

        // Función Cargar Página
        function loadPage(url, element) {
            // UI Activa
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');

            // Mostrar Iframe
            welcomeScreen.classList.add('hidden');
            iframe.classList.remove('hidden');
            
            // Cargar URL
            iframe.src = url;

            // En móvil, cerrar menú automáticamente
            if (window.innerWidth < 768) {
                closeSidebar();
            }
        }

        // Función Resetear Vista (Botón Inicio)
        function resetView() {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            iframe.classList.add('hidden');
            welcomeScreen.classList.remove('hidden');
            iframe.src = ""; // Detener carga
            
            if (window.innerWidth < 768) {
                closeSidebar();
            }
        }

        // Lógica del Sidebar Móvil
        function toggleSidebar() {
            const isClosed = sidebar.classList.contains('-translate-x-full');
            if (isClosed) {
                openSidebar();
            } else {
                closeSidebar();
            }
        }

        function openSidebar() {
            sidebar.classList.remove('-translate-x-full');
            overlay.classList.remove('hidden');
        }

        function closeSidebar() {
            sidebar.classList.add('-translate-x-full');
            overlay.classList.add('hidden');
        }

        // Resetear estado al cambiar tamaño de ventana
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) {
                sidebar.classList.remove('-translate-x-full'); // Mostrar siempre en desktop
                overlay.classList.add('hidden');
            } else {
                sidebar.classList.add('-translate-x-full'); // Ocultar por defecto en móvil
                overlay.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
