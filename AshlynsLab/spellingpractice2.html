<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spelling Practice: List 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Fredoka One', cursive;
            background: linear-gradient(180deg, #ffcc80 0%, #ffab91 100%); /* Sunset Gradient */
            overflow: hidden;
            /* TABLET FIX: Use dvh (dynamic viewport height) for Android browser bars */
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            user-select: none;
            touch-action: none;
        }

        /* --- BACKGROUND CLOUDS --- */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.6); /* Slightly transparent for sunset */
            border-radius: 50%;
            z-index: 0;
            animation: drift linear infinite;
        }
        .cloud::after, .cloud::before {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }
        .c1 { width: 120px; height: 50px; top: 10%; left: -20%; animation-duration: 45s; }
        .c1::after { width: 50px; height: 50px; top: -25px; left: 20px; }
        .c1::before { width: 60px; height: 60px; top: -30px; left: 50px; }

        .c2 { width: 150px; height: 60px; top: 30%; left: -30%; animation-duration: 65s; animation-delay: 5s; }
        .c2::after { width: 60px; height: 60px; top: -30px; left: 25px; }
        .c2::before { width: 70px; height: 70px; top: -40px; left: 60px; }

        @keyframes drift {
            0% { transform: translateX(0); }
            100% { transform: translateX(120vw); }
        }

        /* --- LAYOUT CONTAINERS --- */
        .game-container {
            z-index: 10;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 10px;
            box-sizing: border-box;
            align-items: center;
            width: 100%;
        }

        /* --- TOP PROGRESS LIST --- */
        #progress-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            width: 100%;
            padding: 10px;
            justify-content: center;
            scrollbar-width: none;
            flex-shrink: 0;
            min-height: 60px;
        }
        #progress-bar::-webkit-scrollbar { display: none; }

        .progress-item {
            background: rgba(255, 255, 255, 0.5);
            color: #d84315; /* Deep Orange */
            min-width: 40px;
            height: 40px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .progress-item.active {
            background: #fff;
            border-color: #ff6f00; /* Amber */
            transform: scale(1.1);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .progress-item.solved {
            background: #fff59d; /* Warm Yellow Success */
            color: #e65100;
            padding-left: 15px;
            padding-right: 15px;
            font-size: 0.9rem;
            border-color: #fbc02d;
        }

        /* --- MAIN CONTROLS --- */
        .controls-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 10px 0;
            width: 100%;
            flex-shrink: 1;
        }

        .nav-btn {
            background: rgba(255,255,255,0.9);
            border: none;
            font-size: 1.2rem;
            font-family: 'Fredoka One', cursive;
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 30px;
            color: #d84315; /* Deep Orange */
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 100px;
            justify-content: center;
        }
        .nav-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.1); }

        #play-btn {
            width: 100px;
            height: 100px;
            background: #ff9800; /* Orange */
            border-radius: 50%;
            border: 5px solid white;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0 #e65100;
            cursor: pointer;
            transition: transform 0.1s;
            flex-shrink: 0;
            position: relative;
        }
        #play-btn span.icon { font-size: 2.5rem; line-height: 1; }
        #play-btn span.text { font-size: 1rem; margin-top: 5px; }
        #play-btn:active { transform: scale(0.95); box-shadow: 0 3px 0 #e65100; }

        /* The New Peek Button (Matching Sunset Theme) */
        #peek-btn {
            width: 60px;
            height: 60px;
            background: #ffca28; /* Amber/Yellow for Contrast */
            border-radius: 50%;
            border: 4px solid white;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 4px 0 #ff6f00;
            cursor: pointer;
            margin-left: -20px; /* Overlap slightly or sit close */
            z-index: 5;
            transition: transform 0.1s;
        }
        #peek-btn:active { transform: scale(0.95); box-shadow: 0 2px 0 #ff6f00; }
        #peek-btn.disabled { filter: grayscale(1); cursor: not-allowed; }

        /* --- WORD INPUT AREA --- */
        #word-display {
            display: flex;
            gap: 8px;
            margin: 10px 0 20px 0;
            min-height: 60px;
            justify-content: center;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .letter-slot {
            width: 50px;
            height: 60px;
            background: white;
            border-radius: 10px;
            border-bottom: 4px solid #ffab91; /* Peach border */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #bf360c;
            transition: background-color 0.3s;
        }

        .slot-correct { background-color: #fff9c4 !important; border-color: #fbc02d !important; }
        .slot-wrong { background-color: #ffccbc !important; border-color: #d84315 !important; }
        
        /* Hint State */
        .slot-hint { color: #0288d1; opacity: 0.7; }

        /* SPECIAL RULE HIGHLIGHT */
        .slot-rule-highlight {
            background-color: #ffcc80 !important; /* Orange-Gold */
            border-color: #e65100 !important;      /* Deep Orange */
            color: #fff !important;                /* White Text */
            text-shadow: 1px 1px 0 #bf360c;
            transform: scale(1.1);
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
        }

        /* --- KEYBOARD --- */
        .keyboard-area {
            margin-top: auto;
            width: 100%;
            max-width: 800px;
            background: rgba(255,255,255,0.4);
            padding: 10px;
            border-radius: 20px 20px 0 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }

        .kb-row {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .key-btn {
            background: #fff3e0; /* Pale Orange Background */
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: #e65100; /* Dark Orange Text */
            box-shadow: 0 4px 0 #ffb74d; /* Orange Shadow */
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .key-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.2); }

        .action-row {
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            margin-top: 5px;
        }

        .big-btn {
            border-radius: 15px;
            padding: 10px 20px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
            color: white;
            border: none;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            cursor: pointer;
        }
        .big-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.2); }

        #delete-btn { background: #d84315; box-shadow: 0 4px 0 #bf360c; } /* Dark Red/Orange */
        #check-btn { background: #ffb74d; box-shadow: 0 4px 0 #f57c00; } /* Bright Orange */

        /* --- TABLET LANDSCAPE MODE ADJUSTMENTS --- */
        @media (max-height: 600px) {
            #play-btn { width: 80px; height: 80px; }
            #play-btn span.icon { font-size: 1.8rem; }
            #play-btn span.text { font-size: 0.8rem; }
            #peek-btn { width: 50px; height: 50px; font-size: 1.5rem; }
            
            .nav-btn { padding: 8px 15px; font-size: 1rem; min-width: 80px; }
            #word-display { margin: 5px 0 10px 0; min-height: 50px; }
            .letter-slot { width: 40px; height: 50px; font-size: 1.5rem; }
            .keyboard-area { padding-top: 5px; gap: 4px; }
            .key-btn { width: 40px; height: 40px; font-size: 1rem; }
            .big-btn { padding: 8px 15px; font-size: 1rem; }
            .controls-area { margin: 5px 0; }
        }

        #home-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            text-decoration: none;
            font-size: 1.5rem;
            background: white;
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 50;
        }

        .confetti {
            position: absolute;
            width: 10px; height: 10px;
            background-color: #f00;
            animation: fall linear forwards;
            z-index: 100;
        }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }
    </style>
</head>
<body>

    <a href="index.html" id="home-btn">🏠</a>

    <!-- Clouds -->
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>

    <div class="game-container">
        
        <!-- Progress Strip -->
        <div id="progress-bar">
            <!-- Populated by JS -->
        </div>

        <!-- Controls -->
        <div class="controls-area">
            <button class="nav-btn" onclick="prevWord()">
                <span>◀ Back</span>
            </button>
            
            <div style="display: flex; align-items: center;">
                <button id="play-btn" onclick="playCurrentWord()">
                    <span class="icon">🔊</span>
                    <span class="text">Play</span>
                </button>
                <button id="peek-btn" onclick="peekWord()" title="Peek at the word">
                    👁️
                </button>
            </div>

            <button class="nav-btn" onclick="nextWord()">
                <span>Next ▶</span>
            </button>
        </div>

        <!-- Word Blanks -->
        <div id="word-display">
            <!-- Blanks go here -->
        </div>

        <!-- Keyboard Area -->
        <div class="keyboard-area">
            <div class="action-row">
                <button id="check-btn" class="big-btn" onclick="checkSpelling()">Let's Check 🔍</button>
                <button id="delete-btn" class="big-btn" onclick="deleteLetter()">Delete ⌫</button>
            </div>
            
            <div style="height: 10px;"></div>

            <div class="kb-row" id="row-1"></div>
            <div class="kb-row" id="row-2"></div>
            <div class="kb-row" id="row-3"></div>
        </div>

    </div>

    <script>
        // --- DATA WITH RULES (Doubling Rule) ---
        // Indices highlight the phonics change (vowel or double consonant + suffix)
        const listTwoData = [
            { word: "tap", rule: [1] },                  // a
            { word: "tapping", rule: [2, 3, 4, 5, 6] },  // pping
            { word: "bag", rule: [1] },                  // a
            { word: "begged", rule: [2, 3, 4, 5] },      // gged
            { word: "skip", rule: [2] },                 // i
            { word: "skipping", rule: [3, 4, 5, 6, 7] }, // pping
            { word: "drop", rule: [2] },                 // o
            { word: "dropped", rule: [3, 4, 5, 6] },     // pped
            { word: "run", rule: [1] },                  // u
            { word: "running", rule: [2, 3, 4, 5, 6] },  // nning
            { word: "clapped", rule: [3, 4, 5, 6] },     // pped
            { word: "tripped", rule: [3, 4, 5, 6] },     // pped
            { word: "stopping", rule: [3, 4, 5, 6, 7] }  // pping
        ];
        
        let gameData = [];
        let currentIndex = 0;
        let currentInput = "";
        let isPeeking = false;

        // --- ELEMENTS ---
        const progressBar = document.getElementById('progress-bar');
        const wordDisplay = document.getElementById('word-display');
        const playBtn = document.getElementById('play-btn');
        const peekBtn = document.getElementById('peek-btn');

        // --- INIT ---
        function initGame() {
            // Shuffle and Setup Game Data
            gameData = listTwoData
                .map(item => ({ ...item, solved: false }))
                .sort(() => Math.random() - 0.5);
            
            currentIndex = 0;
            renderProgressBar();
            loadWord();
            setupKeyboard();
        }

        // --- RENDER FUNCTIONS ---
        function renderProgressBar() {
            progressBar.innerHTML = '';
            gameData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'progress-item';
                if (index === currentIndex) div.classList.add('active');
                
                if (item.solved) {
                    div.classList.add('solved');
                    div.textContent = item.word;
                } else {
                    div.textContent = index + 1;
                }
                
                div.onclick = () => {
                    currentIndex = index;
                    loadWord();
                };

                progressBar.appendChild(div);
            });
            
            const active = progressBar.querySelector('.active');
            if (active) active.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
        }

        function loadWord() {
            currentInput = "";
            isPeeking = false;
            
            // Check if solved, update Peek button status
            if (gameData[currentIndex].solved) {
                peekBtn.classList.add('disabled');
            } else {
                peekBtn.classList.remove('disabled');
            }

            renderProgressBar(); 
            renderBlanks();
            
            if (gameData[currentIndex].solved) {
                currentInput = gameData[currentIndex].word;
                renderBlanks();
                applyRuleHighlight();
            }
        }

        function renderBlanks() {
            wordDisplay.innerHTML = '';
            const targetWord = gameData[currentIndex].word;
            
            const textToShow = isPeeking ? targetWord : currentInput;
            const inputLen = textToShow.length;

            for (let i = 0; i < targetWord.length; i++) {
                const slot = document.createElement('div');
                slot.className = 'letter-slot';
                
                if (i < inputLen) {
                    slot.textContent = textToShow[i];
                    if (isPeeking) slot.classList.add('slot-hint');
                }
                wordDisplay.appendChild(slot);
            }
        }

        // --- GAME LOGIC ---
        function playCurrentWord() {
            const word = gameData[currentIndex].word;
            speak(word);
        }

        function peekWord() {
            if (gameData[currentIndex].solved || isPeeking) return;
            
            isPeeking = true;
            renderBlanks();
            speak(gameData[currentIndex].word); 
            
            setTimeout(() => {
                isPeeking = false;
                renderBlanks();
            }, 2000);
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.7; 
            utterance.pitch = 1.1;
            window.speechSynthesis.speak(utterance);
        }

        function typeLetter(letter) {
            if (isPeeking) return;
            const targetWord = gameData[currentIndex].word;
            if (gameData[currentIndex].solved) return; 

            if (currentInput.length < targetWord.length) {
                currentInput += letter;
                renderBlanks();
                
                if (currentInput.toLowerCase() === targetWord.toLowerCase()) {
                    handleCorrect();
                }
            }
        }

        function deleteLetter() {
            if (gameData[currentIndex].solved || isPeeking) return;
            currentInput = currentInput.slice(0, -1);
            renderBlanks();
        }

        function checkSpelling() {
            if (gameData[currentIndex].solved || isPeeking) return;

            const targetWord = gameData[currentIndex].word;
            const slots = document.querySelectorAll('.letter-slot');

            for (let i = 0; i < slots.length; i++) {
                if (!currentInput[i]) continue; 

                if (currentInput[i] === targetWord[i]) {
                    slots[i].classList.add('slot-correct');
                } else {
                    slots[i].classList.add('slot-wrong');
                    playSound('error');
                }
            }

            setTimeout(() => {
                slots.forEach(s => {
                    s.classList.remove('slot-correct', 'slot-wrong');
                });
            }, 3000);
        }

        function handleCorrect() {
            if (gameData[currentIndex].solved) return; 
            
            gameData[currentIndex].solved = true;
            renderBlanks(); 
            peekBtn.classList.add('disabled');
            
            const slots = document.querySelectorAll('.letter-slot');
            slots.forEach(s => s.classList.add('slot-correct'));

            applyRuleHighlight();

            playSound('success');
            speak("Great Job!");
            celebrate();
            renderProgressBar();

            setTimeout(() => {
                if (currentIndex < gameData.length - 1) {
                    nextWord();
                } else {
                    speak("You finished the list!");
                }
            }, 2500);
        }

        function applyRuleHighlight() {
            if (!gameData[currentIndex].solved) return;

            const ruleIndices = gameData[currentIndex].rule;
            const slots = document.querySelectorAll('.letter-slot');

            ruleIndices.forEach(idx => {
                if (slots[idx]) {
                    slots[idx].classList.remove('slot-correct');
                    slots[idx].classList.add('slot-rule-highlight');
                }
            });
        }

        // --- NAVIGATION ---
        function prevWord() {
            if (currentIndex > 0) {
                currentIndex--;
                loadWord();
            }
        }

        function nextWord() {
            if (currentIndex < gameData.length - 1) {
                currentIndex++;
                loadWord();
            }
        }

        // --- KEYBOARD SETUP ---
        function setupKeyboard() {
            const row1 = "qwertyuiop".split('');
            const row2 = "asdfghjkl".split('');
            const row3 = "zxcvbnm".split('');

            const r1 = document.getElementById('row-1');
            const r2 = document.getElementById('row-2');
            const r3 = document.getElementById('row-3');

            row1.forEach(l => createKey(l, r1));
            row2.forEach(l => createKey(l, r2));
            row3.forEach(l => createKey(l, r3));
        }

        function createKey(letter, container) {
            const btn = document.createElement('button');
            btn.className = 'key-btn';
            btn.textContent = letter;
            btn.onclick = () => typeLetter(letter);
            container.appendChild(btn);
        }

        // --- AUDIO & FX ---
        function playSound(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'success') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1000, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.5);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            }
        }

        function celebrate() {
            const colors = ['#f44336', '#2196f3', '#ffeb3b', '#4caf50', '#9c27b0'];
            for (let i = 0; i < 50; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(conf);
                setTimeout(() => conf.remove(), 4000);
            }
        }

        // Start
        initGame();

    </script>
</body>
</html>
