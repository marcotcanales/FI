<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados Encuesta Estructural</title>
    
    <!-- 1. Cargar Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Cargar React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- 3. Cargar Prop-types -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    
    <!-- 4. Cargar Recharts (Fuente CDNJS más estable) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js"></script>
    
    <!-- 5. Cargar Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .fade-in { animation: fadeIn 0.5s ease-in; }
        .slide-in { animation: slideIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        // Acceso seguro a las variables globales
        const { useState } = React;
        
        // Fallback simple si Recharts falla al cargar
        const RechartsLib = window.Recharts || {};
        const { PieChart, Pie, Cell, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = RechartsLib;

        // --- ICONOS SVG (Simples y sin dependencias externas) ---
        const IconWrapper = ({ children, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );
        const BookOpen = ({ className }) => <IconWrapper className={className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></IconWrapper>;
        const PenTool = ({ className }) => <IconWrapper className={className}><path d="m12 19 7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="m2 2 7.586 7.586"/><circle cx="11" cy="11" r="2"/></IconWrapper>;
        const Layout = ({ className }) => <IconWrapper className={className}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="9" x2="9" y1="9" y2="21"/></IconWrapper>;
        const Quote = ({ className }) => <IconWrapper className={className}><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/></IconWrapper>;
        const BarChart2 = ({ className }) => <IconWrapper className={className}><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></IconWrapper>;
        const Users = ({ className }) => <IconWrapper className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconWrapper>;
        const AlertCircle = ({ className }) => <IconWrapper className={className}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></IconWrapper>;

        // --- COLORES ---
        const COLORS = {
            primary: '#0088FE',
            secondary: '#00C49F',
            tertiary: '#FFBB28',
            quaternary: '#FF8042',
            neutral: '#9ca3af',
            red: '#ef4444'
        };
        const PIE_COLORS = [COLORS.primary, COLORS.secondary, COLORS.tertiary, COLORS.neutral];

        // --- DATOS ---
        const comparativeData = [
            { 
                id: "L1", 
                question: "Entendimiento Profundo", 
                fullQuestion: "Siento que entiendo por qué las estructuras se comportan como lo hacen, más allá de simplemente saber usar las fórmulas o el software.",
                data: [ { name: 'Trayectoria A', 'Totalmente de acuerdo': 66, 'De acuerdo': 0, 'Neutro': 33 }, { name: 'Trayectoria B', 'Totalmente de acuerdo': 100, 'De acuerdo': 0, 'Neutro': 0 }, { name: 'Trayectoria C', 'Totalmente de acuerdo': 0, 'De acuerdo': 100, 'Neutro': 0 } ], keys: ['Totalmente de acuerdo', 'De acuerdo', 'Neutro'] 
            },
            { 
                id: "L2", 
                question: "Idealización vs Matemáticas", 
                fullQuestion: "La evaluación que realicé me ayudó a entender que el Análisis Estructural es un proceso de idealización (donde mi criterio define la geometría y las cargas) y no solo un proceso matemático exacto.",
                data: [ { name: 'Trayectoria A', 'Totalmente de acuerdo': 33, 'De acuerdo': 33, 'Neutro': 33 }, { name: 'Trayectoria B', 'Totalmente de acuerdo': 100, 'De acuerdo': 0, 'Neutro': 0 }, { name: 'Trayectoria C', 'Totalmente de acuerdo': 50, 'De acuerdo': 50, 'Neutro': 0 } ], keys: ['Totalmente de acuerdo', 'De acuerdo', 'Neutro'] 
            },
            { 
                id: "L3", 
                question: "Toma de Decisiones", 
                fullQuestion: "Me siento capaz de tomar decisiones de diseño (como asumir una carga viva o un tipo de apoyo) incluso cuando no tengo toda la información perfecta o completa.",
                data: [ { name: 'Trayectoria A', 'Totalmente de acuerdo': 33, 'De acuerdo': 33, 'Neutro': 33 }, { name: 'Trayectoria B', 'Totalmente de acuerdo': 50, 'De acuerdo': 50, 'Neutro': 0 }, { name: 'Trayectoria C', 'Totalmente de acuerdo': 0, 'De acuerdo': 100, 'Neutro': 0 } ], keys: ['Totalmente de acuerdo', 'De acuerdo', 'Neutro'] 
            },
            { 
                id: "L4", 
                question: "Uso Real y Seguridad", 
                fullQuestion: "Siento que la evaluación me hizo considerar el uso real, la seguridad y las necesidades de las personas que habitarán la estructura (ej. al calcular Carga de Viento o Sismo).",
                data: [ { name: 'Trayectoria A', 'Totalmente de acuerdo': 66, 'De acuerdo': 33, 'Neutro': 0 }, { name: 'Trayectoria B', 'Totalmente de acuerdo': 100, 'De acuerdo': 0, 'Neutro': 0 }, { name: 'Trayectoria C', 'Totalmente de acuerdo': 0, 'De acuerdo': 0, 'Neutro': 100 } ], keys: ['Totalmente de acuerdo', 'De acuerdo', 'Neutro'] 
            },
            { 
                id: "L5", 
                question: "Responsabilidad Ética", 
                fullQuestion: "Sentí la responsabilidad ética de que mis cálculos (o mi modelo) impactan directamente en la seguridad pública y el cumplimiento del código (CHOC).",
                data: [ { name: 'Trayectoria A', 'Totalmente de acuerdo': 100, 'De acuerdo': 0 }, { name: 'Trayectoria B', 'Totalmente de acuerdo': 100, 'De acuerdo': 0 }, { name: 'Trayectoria C', 'Totalmente de acuerdo': 50, 'De acuerdo': 50 } ], keys: ['Totalmente de acuerdo', 'De acuerdo'] 
            },
            { 
                id: "L6", 
                question: "Aplicabilidad", 
                fullQuestion: "Siento que puedo aplicar lo aprendido en esta evaluación a situaciones completamente nuevas o a otros cursos de la carrera.",
                data: [ { name: 'Trayectoria A', 'Totalmente de acuerdo': 100, 'De acuerdo': 0 }, { name: 'Trayectoria B', 'Totalmente de acuerdo': 100, 'De acuerdo': 0 }, { name: 'Trayectoria C', 'Totalmente de acuerdo': 0, 'De acuerdo': 100 } ], keys: ['Totalmente de acuerdo', 'De acuerdo'] 
            },
            { 
                id: "L7", 
                question: "Esfuerzo Percibido", 
                fullQuestion: "Comparado con la otra opción de evaluación disponible, siento que mi elección requirió:",
                data: [ { name: 'Trayectoria A', 'Esfuerzo similar': 100, 'Mucho más esfuerzo': 0, 'Mucho menos esfuerzo': 0 }, { name: 'Trayectoria B', 'Esfuerzo similar': 50, 'Mucho más esfuerzo': 50, 'Mucho menos esfuerzo': 0 }, { name: 'Trayectoria C', 'Esfuerzo similar': 50, 'Mucho más esfuerzo': 0, 'Mucho menos esfuerzo': 50 } ], keys: ['Mucho más esfuerzo', 'Esfuerzo similar', 'Mucho menos esfuerzo'] 
            },
            { 
                id: "L8", 
                question: "Elección Futura", 
                fullQuestion: "Si pudieras volver a cursar la asignatura, ¿volverías a elegir el mismo método de evaluación?",
                data: [ { name: 'Trayectoria A', 'Mismo método': 0, 'Tal vez cambiaría': 66, 'Cambiaría': 33 }, { name: 'Trayectoria B', 'Mismo método': 100, 'Tal vez cambiaría': 0, 'Cambiaría': 0 }, { name: 'Trayectoria C', 'Mismo método': 50, 'Tal vez cambiaría': 0, 'Cambiaría': 50 } ], keys: ['Mismo método', 'Tal vez cambiaría', 'Cambiaría'] 
            }
        ];

        const trajectoryData = {
            A: {
                title: "Trayectoria A - Evaluación Tradicional",
                icon: <BookOpen className="w-6 h-6" />,
                description: "Estudiantes que optaron únicamente por la evaluación tradicional mediante exámenes.",
                pieCharts: [ 
                    { 
                        title: "PA1", 
                        question: "Siendo honesto, ¿cuál fue el factor determinante para no intentar el proyecto?",
                        data: [ { name: 'Factor Tiempo', value: 66 }, { name: 'Costumbre/Examen', value: 33 } ] 
                    } 
                ],
                quotes: [
                    { 
                        title: "PA2", 
                        question: "Los proyectos buscan simular la vida real de un ingeniero. ¿Sientes que al elegir el examen perdiste la oportunidad de desarrollar esas habilidades?",
                        responses: [ "Al final sentí que era mejor opción el proyecto por la toma de decisiones y si volviera a haber la oportunidad escogería el proyecto", "Si, la verdad que sentí que mis compañeros que realizaron el proyecto pudieron trabajar de manera más cercana a lo que nos espera en un ambiente laboral", "Quizás sí pero el tiempo fue un factor" ] 
                    },
                    { 
                        title: "PA3", 
                        question: "¿Sentiste que el examen evaluó tu criterio ingenieril y capacidad de modelación, o principalmente tu capacidad de cálculo numérico?",
                        responses: [ "El examen si tenía el mismo nivel de dificultad que el proyecto pero el factor tiempo... y la facilidad de obtener una mejor nota y tener retroalimentación era mejor en el proyecto", "No", "Capacidad de modelación" ] 
                    },
                    { 
                        title: "OA1", 
                        question: "Reflexión sobre cambios al curso:",
                        responses: [ "No cambiaría nada porque el desarrollo del curso estuvo bien explicado...", "Que si se da la opción de un proyecto sea como el del segundo parcial, elegir el modelo", "Creo que nada" ] 
                    }
                ]
            },
            B: {
                title: "Trayectoria B - Evaluación CGS",
                icon: <Layout className="w-6 h-6" />,
                description: "Estudiantes que realizaron proyectos individuales y grupales simulando un rol de consultor.",
                pieCharts: [ 
                    { 
                        title: "PB1", 
                        question: "Comparado con tus compañeros que estudiaron para exámenes, ¿cómo describirías tu carga de trabajo?",
                        data: [ { name: 'Inversión Alta (Más horas, más aprendizaje)', value: 100 } ] 
                    } 
                ],
                quotes: [
                    { 
                        title: "PB2", 
                        question: "¿Sentiste que dejaste de actuar como 'estudiante que quiere nota' y empezaste a pensar como un 'Solucionador de Problemas Empático'?",
                        responses: [ "Si, sentí más que todo en el primer proyecto... hasta a otros ingenieros le preguntamos a ver su opinión.", "Sí. Con los proyectos sentí que ya no estaba pensando solo en la nota, sino en resolver un problema real.", "Si ya que realmente así es como vamos a diseñar, con los planos y la computadora, no como una evaluación", "Si, fue necesario empezar a revisar de una manera mas profunda para poder detectar si habia algun error." ] 
                    },
                    { 
                        title: "PB3", 
                        question: "El proyecto utilizaba una metodología basada en roles. ¿Cómo afectó esto tu motivación comparado con un problema típico de libro de texto?",
                        responses: [ "En motivación pues fue mejor... gran satisfacción cuando habían resultados viables.", "Me motivó más que un problema de libro porque se sentía real... ver la estructura en persona hizo que los planos y cálculos tuvieran sentido.", "Es una manera de ver las cosas más aplicadas.", "El hecho de que el proyecto se haya basado en una estructura que nosotros podemos ver hace que sienta mas motivación." ] 
                    },
                    { 
                        title: "OB1", 
                        question: "¿Qué cambiarías de la metodología del curso para mejorar tu aprendizaje futuro?",
                        responses: [ "Usaría el método de los Foros, del segundo parcial... había más orden y coordinación.", "Tal vez se podría incluir más tiempo para preguntas o discusión.", "La verdad que estoy muy satisfecho en cómo llevamos el curso", "Considero que fue una clase muy productiva... la combinación entre el STAAD y los calculos manuales fue excelente." ] 
                    }
                ]
            },
            C: {
                title: "Trayectoria C - Evaluación Mixta",
                icon: <PenTool className="w-6 h-6" />,
                description: "Estudiantes que experimentaron ambos métodos de evaluación durante el curso.",
                pieCharts: [
                    { 
                        title: "PC1", 
                        question: "¿Cuál generó mayor ansiedad/estrés?",
                        data: [ { name: 'El Examen', value: 50 }, { name: 'El Proyecto', value: 50 } ] 
                    },
                    { 
                        title: "PC2", 
                        question: "¿Cuál obligó a entender realmente el comportamiento de la estructura (física) y no solo la matemática?",
                        data: [ { name: 'El Proyecto', value: 100 } ] 
                    },
                    { 
                        title: "PC3", 
                        question: "¿Cuál te hizo sentir más orgulloso de tu resultado final?",
                        data: [ { name: 'El Proyecto', value: 100 } ] 
                    }
                ],
                quotes: [
                    { 
                        title: "PC4", 
                        question: "Decidiste cambiar de método entre la primera y la segunda evaluación. ¿Qué motivó ese cambio?",
                        responses: [ "En el primero hice examen porque vi que era mucho trabajo... En el segundo hice proyecto porque ya le entendía más a la clase.", "Hice El primer proyecto pero no hice el segundo, principalmente por mi computadora." ] 
                    },
                    { 
                        title: "OC1", 
                        question: "¿Qué cambiarías de la metodología del curso para mejorar tu aprendizaje futuro?",
                        responses: [ "Nada, todo me pareció bien explicado a pesar que fuera una clase bien analítica.", "Más tiempo para hacer el primer proyecto." ] 
                    }
                ]
            }
        };

        const QuoteCard = ({ text }) => (
            <div className="bg-white p-4 rounded-lg shadow-sm border-l-4 border-indigo-500 mb-3 hover:shadow-md transition-shadow">
                <div className="flex items-start gap-2">
                    <div className="text-indigo-300 min-w-[20px] mt-1"><Quote size={20} /></div>
                    <p className="text-gray-700 italic text-sm md:text-base leading-relaxed">"{text}"</p>
                </div>
            </div>
        );

        const SectionHeader = ({ title, subtitle }) => (
            <div className="mb-6">
                <h2 className="text-xl md:text-2xl font-bold text-gray-800">{title}</h2>
                {subtitle && <p className="text-gray-500 mt-1">{subtitle}</p>}
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('comparative');
            const [selectedQuestion, setSelectedQuestion] = useState(comparativeData[0].id);

            // Verificación simple para renderizado condicional
            if (!BarChart) {
                return <div className="p-8 text-center text-red-600">Error cargando gráficos. Por favor recarga la página.</div>;
            }

            const renderContent = () => {
                if (activeTab === 'comparative') {
                    const currentQData = comparativeData.find(d => d.id === selectedQuestion);
                    return (
                        <div className="fade-in">
                            <SectionHeader title="Análisis Comparativo (Preguntas L)" subtitle="Comparación de percepciones entre las tres trayectorias de aprendizaje." />
                            <div className="bg-white p-6 rounded-xl shadow-lg border border-gray-100">
                                <div className="mb-8">
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Selecciona una métrica para comparar:</label>
                                    <select value={selectedQuestion} onChange={(e) => setSelectedQuestion(e.target.value)} className="w-full md:w-1/2 p-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all cursor-pointer">
                                        {comparativeData.map(q => (<option key={q.id} value={q.id}>{q.id} - {q.question}</option>))}
                                    </select>
                                </div>
                                <div className="h-[400px] w-full mt-4">
                                    <h3 className="text-center font-semibold text-gray-800 mb-2">{currentQData.question}</h3>
                                    
                                    <ResponsiveContainer width="100%" height="90%">
                                        <BarChart data={currentQData.data} layout="vertical" margin={{ top: 20, right: 30, left: 20, bottom: 5 }}>
                                            <CartesianGrid strokeDasharray="3 3" horizontal={false} />
                                            <XAxis type="number" domain={[0, 100]} unit="%" />
                                            <YAxis type="category" dataKey="name" width={100} />
                                            <Tooltip contentStyle={{ backgroundColor: 'rgba(255, 255, 255, 0.95)', borderRadius: '8px', boxShadow: '0 4px 6px -1px rgba(0, 0, 0, 0.1)' }} cursor={{fill: 'transparent'}}/>
                                            <Legend wrapperStyle={{ paddingTop: '20px' }}/>
                                            {currentQData.keys.map((key) => (
                                                <Bar 
                                                    key={key} 
                                                    dataKey={key} 
                                                    stackId="a" 
                                                    fill={
                                                        key.includes("Totalmente") || key.includes("Mismo") ? COLORS.secondary : 
                                                        key.includes("De acuerdo") || key.includes("Similar") ? COLORS.primary : 
                                                        key.includes("Neutro") || key.includes("Tal vez") ? COLORS.neutral : 
                                                        key.includes("más esfuerzo") ? COLORS.quaternary :
                                                        key.includes("menos esfuerzo") ? COLORS.secondary :
                                                        COLORS.red
                                                    } 
                                                    animationDuration={1500} 
                                                />
                                            ))}
                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>
                                <div className="mt-8 p-4 bg-gray-50 border border-gray-200 rounded-lg">
                                    <p className="text-gray-700 text-sm font-medium text-center italic">"{currentQData.fullQuestion}"</p>
                                </div>
                                <div className="mt-6 p-4 bg-blue-50 rounded-lg flex items-start gap-3">
                                    <div className="text-blue-600 mt-1 flex-shrink-0"><AlertCircle size={20}/></div>
                                    <div>
                                        <h4 className="font-semibold text-blue-900">Observación Clave</h4>
                                        <p className="text-blue-800 text-sm">
                                            {selectedQuestion === "L1" && "La Trayectoria B (Solo Proyecto) muestra un 100% de acuerdo total en el entendimiento profundo."}
                                            {selectedQuestion === "L5" && "Ambas Trayectorias A y B muestran alta conciencia de responsabilidad ética (100%)."}
                                            {selectedQuestion === "L7" && "Los estudiantes de Proyecto reportaron 'Más Esfuerzo' (Naranja) significativamente más que los de Examen."}
                                            {!["L1", "L5", "L7"].includes(selectedQuestion) && "Analiza los datos para encontrar diferencias clave."}
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    );
                } else {
                    const data = trajectoryData[activeTab];
                    return (
                        <div className="slide-in">
                            <div className="flex items-center gap-3 mb-6 bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                                <div className="p-3 bg-indigo-100 text-indigo-600 rounded-full">{data.icon}</div>
                                <div><h2 className="text-2xl font-bold text-gray-900">{data.title}</h2><p className="text-gray-500">{data.description}</p></div>
                            </div>
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                <div className="space-y-6">
                                    {data.pieCharts.map((chart, idx) => (
                                        <div key={idx} className="bg-white p-6 rounded-xl shadow-lg border border-gray-100">
                                            <h3 className="font-semibold text-gray-800 flex items-center gap-2"><div className="text-indigo-500"><BarChart2 size={18}/></div>{chart.title}</h3>
                                            <p className="text-sm text-gray-500 mt-1 mb-4 italic">{chart.question}</p>
                                            <div className="h-[250px]">
                                                <ResponsiveContainer width="100%" height="100%">
                                                    <PieChart>
                                                        <Pie data={chart.data} cx="50%" cy="50%" labelLine={false} label={({ name, percent }) => `${(percent * 100).toFixed(0)}%`} outerRadius={80} fill="#8884d8" dataKey="value">
                                                            {chart.data.map((entry, index) => (<Cell key={`cell-${index}`} fill={PIE_COLORS[index % PIE_COLORS.length]} />))}
                                                        </Pie>
                                                        <Tooltip /><Legend verticalAlign="bottom" height={36}/>
                                                    </PieChart>
                                                </ResponsiveContainer>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="space-y-6">
                                    {data.quotes.map((q, idx) => (
                                        <div key={idx} className="bg-slate-50 p-6 rounded-xl border border-slate-200">
                                            <h3 className="font-bold text-slate-800 text-lg">{q.title}</h3>
                                            <p className="text-sm text-slate-600 mt-1 mb-4 italic">{q.question}</p>
                                            <div className="space-y-2">{q.responses.map((resp, i) => (<QuoteCard key={i} text={resp} />))}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    );
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 font-sans text-gray-900 pb-12">
                    <header className="bg-indigo-700 text-white pt-10 pb-20 px-4 md:px-8 shadow-md">
                        <div className="max-w-7xl mx-auto">
                            <div className="flex items-center gap-3 mb-2 opacity-80"><Users size={20} /><span className="text-sm font-medium tracking-wide uppercase">Estudio de Caso Educativo</span></div>
                            <h1 className="text-3xl md:text-5xl font-bold mb-4">Impacto de la Evaluación</h1>
                            <p className="text-xl text-indigo-100 max-w-2xl">Comparativa de aprendizaje entre Exámenes y Proyectos.<span className="block text-sm mt-2 opacity-75">(n=9 Estudiantes)</span></p>
                        </div>
                    </header>
                    <main className="max-w-7xl mx-auto px-4 md:px-8 -mt-10">
                        <div className="bg-white rounded-xl shadow-lg p-2 mb-8 flex flex-wrap md:flex-nowrap gap-2 overflow-x-auto">
                            <button onClick={() => setActiveTab('comparative')} className={`flex-1 py-3 px-4 rounded-lg font-medium transition-all flex items-center justify-center gap-2 whitespace-nowrap ${activeTab === 'comparative' ? 'bg-indigo-600 text-white shadow-md' : 'text-gray-600 hover:bg-gray-100'}`}><BarChart2 size={18} /> Comparativa (L)</button>
                            <button onClick={() => setActiveTab('A')} className={`flex-1 py-3 px-4 rounded-lg font-medium transition-all flex items-center justify-center gap-2 whitespace-nowrap ${activeTab === 'A' ? 'bg-blue-600 text-white shadow-md' : 'text-gray-600 hover:bg-gray-100'}`}>Trayectoria A</button>
                            <button onClick={() => setActiveTab('B')} className={`flex-1 py-3 px-4 rounded-lg font-medium transition-all flex items-center justify-center gap-2 whitespace-nowrap ${activeTab === 'B' ? 'bg-teal-600 text-white shadow-md' : 'text-gray-600 hover:bg-gray-100'}`}>Trayectoria B</button>
                            <button onClick={() => setActiveTab('C')} className={`flex-1 py-3 px-4 rounded-lg font-medium transition-all flex items-center justify-center gap-2 whitespace-nowrap ${activeTab === 'C' ? 'bg-purple-600 text-white shadow-md' : 'text-gray-600 hover:bg-gray-100'}`}>Trayectoria C</button>
                        </div>
                        {renderContent()}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
