<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spelling Listen: List 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Fredoka One', cursive;
            background: linear-gradient(180deg, #ffcc80 0%, #ffab91 100%); /* Sunset Orange Gradient */
            overflow: hidden; /* Prevent scrolling */
            /* TABLET FIX: Use dvh (dynamic viewport height) for Android browser bars */
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            user-select: none;
            touch-action: none;
        }

        /* --- BACKGROUND CLOUDS --- */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.6); /* Slightly more transparent for sunset blend */
            border-radius: 50%;
            z-index: 0;
            animation: drift linear infinite;
        }

        .cloud::after, .cloud::before {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }

        /* Create random looking clouds */
        .c1 { width: 120px; height: 50px; top: 10%; left: -20%; animation-duration: 25s; }
        .c1::after { width: 50px; height: 50px; top: -25px; left: 20px; }
        .c1::before { width: 60px; height: 60px; top: -30px; left: 50px; }

        .c2 { width: 150px; height: 60px; top: 30%; left: -30%; animation-duration: 35s; animation-delay: 5s; }
        .c2::after { width: 60px; height: 60px; top: -30px; left: 25px; }
        .c2::before { width: 70px; height: 70px; top: -40px; left: 60px; }

        .c3 { width: 100px; height: 40px; top: 60%; left: -10%; animation-duration: 40s; animation-delay: 2s; }
        .c3::after { width: 40px; height: 40px; top: -20px; left: 15px; }
        .c3::before { width: 50px; height: 50px; top: -25px; left: 40px; }

        @keyframes drift {
            0% { transform: translateX(0); }
            100% { transform: translateX(120vw); }
        }

        /* --- GAME AREAS --- */
        #sky-area {
            flex-grow: 1;
            position: relative;
            z-index: 10;
            width: 100%;
        }

        #ground-area {
            height: 30vh;
            min-height: 200px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
            border-top: 4px solid white;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            /* TABLET FIX: Add safe area padding for gesture bar */
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
            box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
        }

        .ground-label {
            color: #bf360c; /* Deep Sunset Red */
            font-size: 1.2rem;
            margin-bottom: 10px;
            opacity: 0.8;
        }

        #collected-words {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            overflow-y: auto;
            flex-grow: 1;
            align-content: flex-start;
        }

        /* --- WORDS --- */
        .word-bubble {
            background: white;
            color: #d84315; /* Deep Orange Text */
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 2rem;
            box-shadow: 0 5px 15px rgba(216, 67, 21, 0.15);
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 3px solid white;
        }

        .word-bubble:active {
            transform: scale(0.9);
            background: #ffccbc; /* Light peach */
        }

        /* Floating State */
        .in-sky {
            position: absolute;
            animation: float-around ease-in-out infinite alternate;
        }

        @keyframes float-around {
            0% { transform: translate(0, 0) rotate(-2deg); }
            100% { transform: translate(10px, 20px) rotate(2deg); }
        }

        /* Dropping Animation State */
        .dropping {
            transition: top 0.5s ease-in, left 0.5s ease-in, transform 0.5s ease-in;
            z-index: 100;
        }

        /* Grounded State */
        .in-ground {
            position: relative !important;
            top: auto !important;
            left: auto !important;
            transform: none !important;
            background: #ffccbc;
            color: #bf360c;
            box-shadow: none;
            border: 3px solid #d84315;
            font-size: 1.5rem;
            animation: none;
            margin: 5px;
        }
        
        .in-ground:active {
            transform: scale(0.95) !important;
            background: #ffab91;
        }

        /* --- CONTROLS --- */
        #reset-btn {
            background: #00897b; /* Teal for contrast against orange */
            color: white;
            border: none;
            padding: 10px 30px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.5rem;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 0 #004d40;
            transition: transform 0.1s;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        #reset-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #004d40;
        }

        #home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 50;
        }

    </style>
</head>
<body>

    <!-- Home Link -->
    <a href="index.html" id="home-btn">🏠</a>

    <!-- Animated Clouds -->
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>

    <!-- Sky Area (Floating Words) -->
    <div id="sky-area"></div>

    <!-- Ground Area (Collected Words) -->
    <div id="ground-area">
        <div class="ground-label">Collected Words</div>
        <div id="collected-words">
            <!-- Dropped words appear here -->
        </div>
        <button id="reset-btn" onclick="resetGame()">Reset 🔄</button>
    </div>

    <script>
        const wordList = [
            "tap", "tapping", "bag", "begged", "skip", 
            "skipping", "drop", "dropped", "run", "running", 
            "clapped", "tripped", "stopping"
        ];

        const skyArea = document.getElementById('sky-area');
        const collectedArea = document.getElementById('collected-words');

        // Initialize Game
        function initGame() {
            // Clear existing
            skyArea.innerHTML = '';
            collectedArea.innerHTML = '';

            // Spawn words in sky
            wordList.forEach((word, index) => {
                createFloatingWord(word, index);
            });
        }

        function createFloatingWord(word, index) {
            const el = document.createElement('div');
            el.classList.add('word-bubble', 'in-sky');
            el.textContent = word;
            
            // Random Position (Keep within bounds of sky)
            // We use percentages to stay responsive
            const randomTop = Math.floor(Math.random() * 70) + 10; // 10% to 80%
            const randomLeft = Math.floor(Math.random() * 80) + 10; // 10% to 90%
            
            // Random Animation variation
            const animDuration = Math.random() * 3 + 3; // 3-6s
            const animDelay = Math.random() * 2; 

            el.style.top = randomTop + '%';
            el.style.left = randomLeft + '%';
            el.style.animationDuration = animDuration + 's';
            el.style.animationDelay = -animDelay + 's'; // Negative delay starts animation mid-way

            // Click Handler
            el.addEventListener('click', () => handleWordClick(el, word));
            
            skyArea.appendChild(el);
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.7; // Slowed down for clarity
            utterance.pitch = 1.1;
            window.speechSynthesis.speak(utterance);
        }

        function handleWordClick(el, word) {
            speak(word);

            // If already in ground, just wiggle or do nothing (speech handles the interaction)
            if (el.classList.contains('in-ground')) {
                // visual feedback for re-click
                el.style.transform = 'scale(1.1)';
                setTimeout(() => el.style.transform = 'none', 100);
                return;
            }

            // Animate Drop
            // 1. Get current absolute position
            const rect = el.getBoundingClientRect();
            
            // 2. Freeze animation by setting exact coordinates
            el.style.animation = 'none'; 
            el.style.top = rect.top + 'px';
            el.style.left = rect.left + 'px';
            el.classList.add('dropping');

            // 3. Calculate target position (rough center of ground area)
            // Ideally we just want it to "fall" off screen or towards bottom
            // Simple approach: Fall down 500px or to bottom of window
            const dropDistance = window.innerHeight - rect.top - 100;
            
            setTimeout(() => {
                el.style.transform = `translateY(${dropDistance}px) rotate(10deg)`;
                el.style.opacity = '0'; // Fade out as it hits "ground"
            }, 10);

            // 4. After animation, actually move DOM element to container
            setTimeout(() => {
                el.remove(); // Remove from sky
                createGroundedWord(word); // Add to ground
            }, 500); // Wait for transition
        }

        function createGroundedWord(word) {
            const el = document.createElement('div');
            el.classList.add('word-bubble', 'in-ground');
            el.textContent = word;
            
            // Click to hear again
            el.addEventListener('click', () => {
                speak(word);
                el.style.transform = 'scale(1.1)';
                setTimeout(() => el.style.transform = 'none', 100);
            });

            collectedArea.appendChild(el);
        }

        function resetGame() {
            // Add sound effect for reset?
            initGame();
        }

        // Start
        initGame();

    </script>
</body>
</html>
