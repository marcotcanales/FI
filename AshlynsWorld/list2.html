<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>List #2: The Big Race</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Racetrack Theme Colors */
            --track-green: #76c95e;
            --track-gray: #546e7a;
            --race-red: #ff3d00;
            --race-yellow: #ffea00;
            --card-bg: #fff;
            --text-color: #37474f;
        }

        body {
            font-family: 'Comic Neue', cursive;
            /* A simple grass and track background pattern */
            background-color: var(--track-green);
            background-image: linear-gradient(transparent 90%, var(--track-gray) 90%);
            background-size: 100% 50px;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            font-family: 'Bangers', cursive;
            color: var(--race-yellow);
            text-shadow: 3px 3px 0px var(--race-red);
            font-size: 3rem;
            letter-spacing: 2px;
            margin: 10px 0;
        }

        /* Mode Switcher */
        .controls {
            background: rgba(0,0,0, 0.2);
            padding: 10px;
            border-radius: 30px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            border: 3px solid var(--race-yellow);
        }

        button {
            background-color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.5rem;
            font-family: 'Bangers', cursive;
            color: var(--track-gray);
            border-radius: 20px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.1s;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        button.active-mode {
            background-color: var(--race-red);
            color: var(--race-yellow);
        }

        /* Container Areas */
        #study-area, #game-area {
            width: 100%;
            max-width: 800px;
            display: none;
        }

        .visible {
            display: flex !important;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        /* Flashcards (Study Mode) - Styled like Racing Bibs */
        .card {
            background-color: var(--card-bg);
            width: 140px;
            height: 140px;
            // border-radius: 15px; /* Changed to look more like a bib */
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--text-color);
            box-shadow: 0 8px 0 #cfd8dc;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s;
            border: 4px solid var(--race-red);
            position: relative;
        }
        
        /* Adding little "pin holes" for the bib look */
        .card::after, .card::before {
            content: '';
            position: absolute;
            top: 10px;
            width: 10px; height: 10px; background: #ccc; border-radius: 50%;
        }
        .card::before { left: 15px; }
        .card::after { right: 15px; }

        .card:active {
            transform: scale(0.95);
        }

        /* Game Mode Styles */
        .game-status {
            width: 100%;
            text-align: center;
            color: white;
            font-family: 'Bangers', cursive;
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0 #000;
        }

        /* Styled as Victory Balloons */
        .balloon {
            background-color: var(--race-yellow);
            width: 130px;
            height: 150px; /* Taller for balloon shape */
            border-radius: 50%;
            border-bottom-left-radius: 50% 60%;
            border-bottom-right-radius: 50% 60%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            color: var(--race-red);
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.1);
            cursor: pointer;
            border: 3px solid white;
            animation: float 3s ease-in-out infinite;
            position: relative;
        }
        
        /* Balloon string */
        .balloon::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            width: 2px;
            height: 20px;
            background: white;
        }

        .balloon:nth-child(even) { animation-duration: 4s; background-color: #ffcc80; color: #bf360c;}
        .balloon:nth-child(3n) { animation-duration: 5s; background-color: #80deea; color: #006064;}

        @keyframes float {
            0% { transform: translateY(0px) rotate(2deg); }
            50% { transform: translateY(-15px) rotate(-2deg); }
            100% { transform: translateY(0px) rotate(2deg); }
        }

        /* Animations */
        .correct {
            background-color: #66bb6a !important;
            color: white !important;
            transform: scale(1.2) !important;
            border-color: #1b5e20 !important;
            transition: all 0.3s;
        }

        .shake {
            animation: shake 0.5s;
            background-color: var(--race-red) !important;
            color: white !important;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        #start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .big-btn {
            font-size: 2.5rem;
            padding: 30px 50px;
            background: var(--race-red);
            color: var(--race-yellow);
            border: 5px solid white;
            border-radius: 20px;
            font-family: 'Bangers', cursive;
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <button class="big-btn" onclick="initAudio()">Start Your Engines! 🏎️</button>
    </div>

    <h1>List #2: The Big Race</h1>

    <div class="controls">
        <button id="btn-study" class="active-mode" onclick="setMode('study')">Pit Stop (Study)</button>
        <button id="btn-game" onclick="setMode('game')">Race! (Play)</button>
    </div>

    <div id="study-area" class="visible">
        </div>

    <div id="game-area">
        <div class="game-status">
            Find the word: <span id="target-word" style="color: var(--race-yellow); text-decoration: underline;">???</span>
            <br>
            <button onclick="speakTarget()" style="padding: 5px 15px; font-size: 1rem; margin-top: 10px; font-family: 'Comic Neue';">🔊 Hear it again</button>
        </div>
        <div id="bubble-container" class="visible">
            </div>
    </div>

    <script>
        // UPDATED LIST #2
        const wordList = ["she", "with", "are", "fast", "from", "list", "has", "sink", "what", "very"];
        
        let currentTarget = "";
        let synth = window.speechSynthesis;
        let voices = [];

        function loadVoices() {
            voices = synth.getVoices();
        }
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }

        function initAudio() {
            document.getElementById('start-overlay').style.display = 'none';
            const utter = new SpeechSynthesisUtterance('');
            synth.speak(utter);
            loadVoices();
            renderStudy();
        }

        function speak(text) {
            if (synth.speaking) {
                synth.cancel();
            }
            const utterThis = new SpeechSynthesisUtterance(text);
            // Kept the slower rate for ESL clarity
            utterThis.rate = 0.8; 
            utterThis.pitch = 1.1; 
            utterThis.lang = 'en-US';
            synth.speak(utterThis);
        }

        function setMode(mode) {
            document.getElementById('study-area').classList.remove('visible');
            document.getElementById('game-area').style.display = 'none';
            document.getElementById('btn-study').classList.remove('active-mode');
            document.getElementById('btn-game').classList.remove('active-mode');

            if (mode === 'study') {
                document.getElementById('study-area').classList.add('visible');
                document.getElementById('btn-study').classList.add('active-mode');
                renderStudy();
            } else {
                document.getElementById('game-area').style.display = 'block';
                document.getElementById('btn-game').classList.add('active-mode');
                startRound();
            }
        }

        function renderStudy() {
            const container = document.getElementById('study-area');
            container.innerHTML = '';
            wordList.forEach(word => {
                const card = document.createElement('div');
                // Using the same card class, but CSS styles it differently now
                card.className = 'card';
                card.innerText = word;
                card.onclick = () => {
                    speak(word);
                    card.style.transform = "scale(1.1) rotate(-5deg)";
                    setTimeout(() => card.style.transform = "scale(1) rotate(0deg)", 200);
                };
                container.appendChild(card);
            });
        }

        function startRound() {
            currentTarget = wordList[Math.floor(Math.random() * wordList.length)];
            document.getElementById('target-word').innerText = "???";
            
            setTimeout(() => speak("Find " + currentTarget), 500);

            const container = document.getElementById('bubble-container');
            container.innerHTML = '';
            
            const shuffled = [...wordList].sort(() => 0.5 - Math.random());

            shuffled.forEach(word => {
                const balloon = document.createElement('div');
                // Changed class name to 'balloon' for clarity in CSS
                balloon.className = 'balloon';
                balloon.innerText = word;
                balloon.onclick = () => checkAnswer(word, balloon);
                container.appendChild(balloon);
            });
        }

        function speakTarget() {
            speak("Find " + currentTarget);
        }

        function checkAnswer(selectedWord, element) {
            if (selectedWord === currentTarget) {
                element.classList.add('correct');
                // A faster, more exciting "race" voice for correct answers
                const winUtter = new SpeechSynthesisUtterance("Vroom! " + selectedWord);
                winUtter.rate = 1.2;
                synth.speak(winUtter);

                document.getElementById('target-word').innerText = currentTarget;
                setTimeout(startRound, 2000);
            } else {
                element.classList.add('shake');
                speak("Try again");
                setTimeout(() => element.classList.remove('shake'), 500);
            }
        }
    </script>
</body>
</html>
