<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ashlyn's World</title>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --princess-pink: #ff80ab;
            --royal-purple: #9c27b0;
            --deep-purple: #4a148c;
            --sparkle-yellow: #ffd740;
        }

        body {
            font-family: 'Fredoka One', cursive;
            background: linear-gradient(135deg, var(--princess-pink), var(--royal-purple));
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden; /* Changed to overflow-x to allow scrolling if needed */
            color: white;
            text-align: center;
        }

        /* Twinkling Background Stars */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: twinkle infinite alternate;
        }
        
        @keyframes twinkle {
            from { opacity: 0.2; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1.2); }
        }

        h1 {
            font-family: 'Chewy', cursive;
            font-size: 4rem;
            margin-bottom: 10px;
            text-shadow: 4px 4px 0px var(--deep-purple);
            z-index: 10;
            animation: floatText 3s ease-in-out infinite;
        }

        @keyframes floatText {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 20px;
            z-index: 10;
        }

        /* The Menu Grid */
        .menu-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            max-width: 1000px;
            z-index: 10;
            margin-bottom: 40px;
        }

        /* The Adventure Cards */
        .adventure-card {
            background: white;
            width: 220px;
            height: 280px;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 20px;
            text-decoration: none; /* Remove underline from links */
            box-shadow: 0 10px 0 rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
            border: 5px solid white;
        }

        .adventure-card:active {
            transform: scale(0.95) translateY(5px);
            box-shadow: 0 5px 0 rgba(0,0,0,0.2);
        }

        /* Individual Card Themes */
        
        /* List 1: Beach */
        .card-beach {
            background: linear-gradient(to bottom, #fff9c4, #81d4fa);
            border-color: #fdd835;
        }
        .card-beach h2 { color: #f57f17; }
        .card-beach .icon { font-size: 5rem; text-shadow: 0 5px 10px rgba(0,0,0,0.1); }

        /* List 2: Race */
        .card-race {
            background: linear-gradient(to bottom, #cfd8dc, #81c784);
            border-color: #388e3c;
        }
        .card-race h2 { color: #2e7d32; }
        .card-race .icon { font-size: 5rem; transform: skew(-10deg); }

        /* List 3: Pond */
        .card-pond {
            background: linear-gradient(to bottom, #b3e5fc, #0288d1);
            border-color: #01579b;
        }
        .card-pond h2 { color: #01579b; }
        .card-pond .icon { font-size: 5rem; }

        /* Noun Town */
        .card-town {
            background: linear-gradient(to bottom, #ffcc80, #ff7043);
            border-color: #d84315;
        }
        .card-town h2 { color: #bf360c; }
        .card-town .icon { font-size: 5rem; }

        /* Noun Game */
        .card-game {
            background: linear-gradient(to bottom, #e1bee7, #ba68c8);
            border-color: #8e24aa;
        }
        .card-game h2 { color: #4a148c; }
        .card-game .icon { font-size: 5rem; }

        /* Noun Sort */
        .card-noun-sort {
            background: linear-gradient(to bottom, #ffcdd2, #e57373);
            border-color: #b71c1c;
        }
        .card-noun-sort h2 { color: #b71c1c; }
        .card-noun-sort .icon { font-size: 5rem; }

        /* Verb Sort */
        .card-verb-sort {
            background: linear-gradient(to bottom, #b2dfdb, #26a69a);
            border-color: #00695c;
        }
        .card-verb-sort h2 { color: #004d40; }
        .card-verb-sort .icon { font-size: 5rem; }

        .adventure-card h2 {
            margin: 0;
            font-size: 1.8rem;
            text-transform: uppercase;
        }

        .play-badge {
            background: var(--deep-purple);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 1rem;
            margin-top: 10px;
        }

        /* Footer */
        .footer {
            margin-top: 20px;
            font-size: 1rem;
            opacity: 0.8;
            z-index: 10;
            padding-bottom: 20px;
        }

    </style>
</head>
<body>

    <!-- Background Stars (Generated by JS below) -->
    <div id="star-container"></div>

    <h1>Ashlyn's World ✨</h1>
    <div class="subtitle">Pick your adventure!</div>

    <div class="menu-container">
        <!-- List 1 Link -->
        <a href="list1.html" class="adventure-card card-beach">
            <div class="icon">🦀</div>
            <h2>The Beach</h2>
            <div class="play-badge">List #1</div>
        </a>

        <!-- List 2 Link -->
        <a href="list2.html" class="adventure-card card-race">
            <div class="icon">🏎️</div>
            <h2>Big Race</h2>
            <div class="play-badge">List #2</div>
        </a>

        <!-- List 3 Link -->
        <a href="list3.html" class="adventure-card card-pond">
            <div class="icon">🐸</div>
            <h2>Magic Pond</h2>
            <div class="play-badge">List #3</div>
        </a>

        <!-- Noun Town -->
        <a href="nouns1.html" class="adventure-card card-town">
            <div class="icon">🏘️</div>
            <h2>Noun Town</h2>
            <div class="play-badge">Sorting</div>
        </a>

        <!-- Noun Game -->
        <a href="nouns2.html" class="adventure-card card-game">
            <div class="icon">🧩</div>
            <h2>Noun Game</h2>
            <div class="play-badge">Grid</div>
        </a>

        <!-- Noun Sort -->
        <a href="noun_sort.html" class="adventure-card card-noun-sort">
            <div class="icon">🧺</div>
            <h2>Noun Sort</h2>
            <div class="play-badge">Basket</div>
        </a>

        <!-- Verb Sort -->
        <a href="verb_sort.html" class="adventure-card card-verb-sort">
            <div class="icon">🏃‍♀️</div>
            <h2>Verb Sort</h2>
            <div class="play-badge">Action</div>
        </a>

    </div>

    <div class="footer">
        Good luck, Super Reader! 📚
    </div>

    <script>
        // Generate sparkling stars in the background
        const body = document.body;
        const starCount = 50;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            
            // Random position
            const x = Math.random() * 100;
            const y = Math.random() * 100;
            
            // Random size
            const size = Math.random() * 4 + 2; // 2px to 6px
            
            // Random animation speed
            const duration = Math.random() * 2 + 1; // 1s to 3s

            star.style.left = x + 'vw';
            star.style.top = y + 'vh';
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.animationDuration = duration + 's';

            body.appendChild(star);
        }

        // Add a gentle "Welcome" voice greeting when she taps anywhere first
        let hasGreeted = false;
        document.body.addEventListener('click', () => {
            if (!hasGreeted) {
                const synth = window.speechSynthesis;
                const utter = new SpeechSynthesisUtterance("Welcome to Ashlyn's World!");
                utter.pitch = 1.2;
                utter.rate = 1.0;
                synth.speak(utter);
                hasGreeted = true;
            }
        });
    </script>
</body>
</html>
