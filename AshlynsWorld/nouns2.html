<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Category Grid</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Comic Neue', cursive;
            background-color: #e3f2fd; /* Light Blue */
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* --- NAVIGATION --- */
        .back-link {
            align-self: flex-start;
            text-decoration: none;
            color: #1565c0;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
            background: white;
            padding: 8px 20px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            font-family: 'Fredoka One', cursive;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: #1565c0;
            font-size: 2.2rem;
            margin: 0 0 20px 0;
            text-align: center;
            text-shadow: 2px 2px 0px white;
        }

        /* --- THE GRID --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); /* Responsive columns */
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            margin-bottom: 80px; /* Space for footer */
        }

        /* --- THE CARD --- */
        .card {
            background: white;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            border: 4px solid white;
            transition: transform 0.2s;
        }

        .card-icon {
            font-size: 4rem;
            margin-bottom: 5px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card-icon:active { transform: scale(1.2); }

        .card-word {
            font-family: 'Fredoka One', cursive;
            font-size: 1.8rem;
            color: #37474f;
            margin-bottom: 15px;
            cursor: pointer;
        }

        /* --- BUTTON GROUP --- */
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 2x2 grid of buttons */
            gap: 8px;
            width: 100%;
        }

        .cat-btn {
            padding: 10px 5px;
            font-size: 1rem;
            font-weight: bold;
            border: 2px solid #cfd8dc;
            background: #eceff1;
            border-radius: 10px;
            cursor: pointer;
            color: #546e7a;
            font-family: 'Comic Neue', cursive;
            transition: all 0.2s;
        }

        /* Active/Selected State for Buttons */
        .cat-btn.selected {
            background-color: #29b6f6;
            color: white;
            border-color: #0288d1;
            box-shadow: 0 4px 0 #0277bd;
            transform: translateY(-2px);
        }

        /* Feedback Overlay */
        .feedback-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8);
            border-radius: 16px;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 5rem;
            z-index: 10;
        }

        /* --- FOOTER --- */
        .action-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(255,255,255,0.95);
            padding: 15px 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
            z-index: 100;
        }

        .big-btn {
            font-family: 'Fredoka One', cursive;
            font-size: 1.4rem;
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        .big-btn:active { transform: translateY(4px); box-shadow: none; }
        
        .btn-clear { background-color: #90a4ae; }
        .btn-check { background-color: #66bb6a; }

    </style>
</head>
<body>

    <a href="index.html" class="back-link">← Ashlyn's World</a>

    <h1>Person, Place, Thing, or Animal?</h1>

    <div class="grid-container" id="grid">
        <!-- JS will build the cards here -->
    </div>

    <div class="action-bar">
        <button class="big-btn btn-clear" onclick="resetGame()">Clear ↺</button>
        <button class="big-btn btn-check" onclick="checkGame()">Let's Check ✔</button>
    </div>

    <script>
        // --- DATA ---
        // Using Emojis for icons to keep it simple and reliable
        const items = [
            { word: "Strawberry", type: "thing", icon: "🍓" },
            { word: "Brush", type: "thing", icon: "🖌️" },
            { word: "Bathroom", type: "place", icon: "🛁" },
            { word: "Bird", type: "animal", icon: "🐦" },
            { word: "Firefighter", type: "person", icon: "👨‍🚒" },
            { word: "Boot", type: "thing", icon: "👢" },
            { word: "Girl", type: "person", icon: "👧" },
            { word: "House", type: "place", icon: "🏠" },
            { word: "Flamingo", type: "animal", icon: "🦩" },
            { word: "City", type: "place", icon: "🏙️" },
            { word: "Baby", type: "person", icon: "👶" },
            { word: "Whale", type: "animal", icon: "🐋" }
        ];

        const categories = ["person", "place", "thing", "animal"];
        const synth = window.speechSynthesis;

        // --- INIT ---
        const grid = document.getElementById('grid');

        items.forEach((item, index) => {
            // Create Card
            const card = document.createElement('div');
            card.className = 'card';
            
            // Icon
            const icon = document.createElement('div');
            icon.className = 'card-icon';
            icon.innerText = item.icon;
            icon.onclick = () => speak(item.word);
            
            // Word
            const word = document.createElement('div');
            word.className = 'card-word';
            word.innerText = item.word;
            word.onclick = () => speak(item.word);

            // Buttons Container
            const btnGroup = document.createElement('div');
            btnGroup.className = 'btn-group';

            // Create the 4 toggle buttons
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'cat-btn';
                btn.innerText = cat;
                btn.dataset.category = cat;
                btn.onclick = () => selectCategory(index, cat, btn);
                btnGroup.appendChild(btn);
            });

            // Feedback Layer (Hidden)
            const feedback = document.createElement('div');
            feedback.className = 'feedback-overlay';
            feedback.id = `feedback-${index}`;

            card.appendChild(icon);
            card.appendChild(word);
            card.appendChild(btnGroup);
            card.appendChild(feedback);
            grid.appendChild(card);
        });

        // --- LOGIC ---
        
        // Track user selections: key = item index, value = selected category
        let selections = {};

        function selectCategory(itemIndex, category, btnElement) {
            speak(category);

            // 1. Update Data
            selections[itemIndex] = category;

            // 2. Update UI (Visual Toggle)
            // Find parent card's button group
            const parentGroup = btnElement.parentElement;
            // Remove 'selected' from all siblings
            const buttons = parentGroup.getElementsByClassName('cat-btn');
            for (let b of buttons) {
                b.classList.remove('selected');
            }
            // Add 'selected' to clicked button
            btnElement.classList.add('selected');

            // Hide feedback if present (re-trying)
            document.getElementById(`feedback-${itemIndex}`).style.display = 'none';
        }

        function checkGame() {
            let correctCount = 0;
            let total = items.length;

            items.forEach((item, index) => {
                const feedbackEl = document.getElementById(`feedback-${index}`);
                const userChoice = selections[index];

                if (userChoice === item.type) {
                    // Correct
                    feedbackEl.innerText = "✅";
                    feedbackEl.style.color = "green";
                    feedbackEl.style.display = "flex";
                    correctCount++;
                } else if (userChoice) {
                    // Wrong choice made
                    feedbackEl.innerText = "❌";
                    feedbackEl.style.color = "red";
                    feedbackEl.style.display = "flex";
                } else {
                    // No choice made - highlight?
                    // Optional: Shake card?
                }
            });

            if (correctCount === total) {
                speak("Good job Ashlyn!");
            } else {
                speak("Almost there. Check the X marks.");
            }
        }

        function resetGame() {
            speak("Clear");
            selections = {};
            
            // Remove all selected classes
            const allBtns = document.getElementsByClassName('cat-btn');
            for (let b of allBtns) {
                b.classList.remove('selected');
            }

            // Hide all feedback
            const allFeedback = document.getElementsByClassName('feedback-overlay');
            for (let f of allFeedback) {
                f.style.display = 'none';
            }
        }

        function speak(text) {
            if (synth.speaking) {
                synth.cancel();
            }
            const utter = new SpeechSynthesisUtterance(text);
            utter.rate = 0.9;
            synth.speak(utter);
        }
        
        // Voice loader for Android
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = function() {
                window.speechSynthesis.getVoices();
            };
        }

    </script>
</body>
</html>
